<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>衡物 · C 端视觉稿（完整主路径）</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --ink: #1a1a1a;
      --muted: #8c8c8c;
      --line: #eeeeee;
      --brand: #2f6f5e;
      --price: #e24b3b;
      --coupon: #fff1e8;
      --coupon-ink: #d96b2b;
      --radius: 10px;
      --shadow: 0 16px 36px rgba(0,0,0,.14);
      --font: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); color: var(--ink); background: #ececec; min-height: 100vh; }
    .page { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
    .layout {
      display: flex; gap: 28px; align-items: flex-start; justify-content: center; flex-wrap: wrap;
    }
    .aside {
      width: 260px; flex-shrink: 0; position: sticky; top: 16px;
    }
    .aside h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.35; }
    .aside .brief { margin: 0; color: #666; font-size: 13px; line-height: 1.55; }
    .aside .meta { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: #777; }
    .aside .meta span, .aside .meta a {
      background: #fff; border: 1px solid #e5e5e5; border-radius: 999px; padding: 4px 10px; color: inherit; text-decoration: none;
    }
    .aside .meta a { color: var(--brand); }
    .aside .note { margin-top: 14px; color: #888; font-size: 12px; line-height: 1.55; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: -1px; }

    /* .tabs 见 hengwu-preview-shared.css */
    .stage { flex-shrink: 0; }
    .phone {
      width: 375px; height: 812px; background: var(--bg); border-radius: 40px;
      border: 11px solid #111; box-shadow: var(--shadow); overflow: hidden;
      position: relative; display: none; flex-direction: column;
    }
    .phone.active { display: flex; }
    .notch {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 28px; background: #111; border-radius: 16px; z-index: 5; pointer-events: none;
    }
    .status {
      height: 44px; padding: 14px 18px 0; display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 600; flex-shrink: 0; position: relative; z-index: 2;
    }
    .scroll { flex: 1; overflow: auto; }
    .scroll::-webkit-scrollbar { width: 0; }

    /* .subnav 样式见 hengwu-preview-shared.css */

    .tabbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 62px;
      background: #fff; border-top: 1px solid #eee;
      display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: 10px; z-index: 4;
    }
    .tabbar span {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 10px; color: #888; position: relative; cursor: pointer;
    }
    .tabbar span.on { color: var(--brand); font-weight: 650; }
    .tabbar .ico { width: 22px; height: 22px; border-radius: 7px; background: #ececec; }
    .tabbar span.on .ico { background: var(--brand); }
    .tabbar .badge {
      position: absolute; top: 4px; right: 22px; min-width: 14px; height: 14px;
      background: var(--price); color: #fff; border-radius: 8px; font-size: 9px;
      line-height: 14px; text-align: center; padding: 0 3px;
    }

    .toast {
      position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(8px);
      background: rgba(0,0,0,.78); color: #fff; font-size: 13px; padding: 10px 14px;
      border-radius: 8px; opacity: 0; pointer-events: none; transition: .18s ease; z-index: 40;
      white-space: nowrap; max-width: 86%; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .sheet-mask {
      position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: none;
    }
    .sheet-mask.show { display: block; }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; background: #fff;
      border-radius: 16px 16px 0 0; padding: 14px 14px 22px; z-index: 31;
      transform: translateY(105%); transition: transform .22s ease;
    }
    .sheet-mask.show .sheet { transform: translateY(0); }

    .btn {
      border: 0; border-radius: 999px; padding: 12px 0; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer;
    }
    .btn.solid { background: var(--brand); color: #fff; }
    .btn.outline { background: transparent; border: 1px solid var(--brand); color: var(--brand); }
    .btn.ghost { background: #fff; border: 1px solid #ddd; color: #444; }
    .btn.soft { background: #eaf4f0; color: var(--brand); }
    .btn.block { width: 100%; }
    .btn.warn { background: #f0a35a; color: #fff; }
    .btn.sm { padding: 6px 12px; font-size: 12px; }

    .panel { background: #fff; margin: 10px; border-radius: 10px; padding: 12px; }
    .cell-row {
      display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px;
    }
    .cell-row:last-child { border-bottom: 0; }
    .cell-row .lab { color: var(--muted); width: 64px; flex-shrink: 0; }
    .cell-row .val { flex: 1; }
    .cell-row .more { color: #bbb; }

    .chk {
      width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #ccc; flex-shrink: 0; cursor: pointer;
    }
    .chk.on { border-color: var(--brand); background: var(--brand); box-shadow: inset 0 0 0 3px #fff; }
    .stepper {
      display: inline-flex; border: 1px solid #e5e5e5; border-radius: 6px; overflow: hidden; font-size: 13px;
    }
    .stepper i { width: 26px; text-align: center; padding: 3px 0; background: #fafafa; color: #666; font-style: normal; cursor: pointer; }
    .stepper b { width: 30px; text-align: center; padding: 3px 0; font-weight: 600; }

    .pic-mug { background: linear-gradient(160deg, #f4f1ea, #cfd9d2 40%, #9eb5a8); position: relative; }
    .pic-book { background: linear-gradient(160deg, #f7f0e4, #e2cba8 45%, #b98c5a); position: relative; }
    .pic-bag { background: linear-gradient(160deg, #efece8, #d5d8d3 40%, #8f9a93); position: relative; }
    .pic-kettle { background: linear-gradient(160deg, #f0eeea, #d2cdc4 42%, #8d8780); position: relative; }
    .pic-lamp { background: linear-gradient(160deg, #f6f3ec, #e8dfc8 40%, #c4ad78); position: relative; }
    .pic-soap { background: linear-gradient(160deg, #f2f7f4, #cfe0d7 45%, #7fa891); position: relative; }
    .pic-mug::after, .pic-book::after, .pic-bag::after, .pic-kettle::after, .pic-lamp::after, .pic-soap::after {
      content: ""; position: absolute; inset: 18% 22% 22% 22%;
      border-radius: 10px; background: rgba(255,255,255,.28);
    }

    /* login */
    .login-wrap { flex: 1; display: flex; flex-direction: column; padding: 40px 24px 20px; background: #fff; overflow: auto; }
    .login-brand { font-size: 36px; font-weight: 750; letter-spacing: .12em; margin-bottom: 6px; }
    .login-sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 14px;
      font: inherit; font-size: 15px; outline: none; background: #fafafa;
    }
    .field input:focus { border-color: var(--brand); background: #fff; }
    .login-tabs {
      display: flex; gap: 0; margin-bottom: 18px; border-bottom: 1px solid #f0f0f0;
    }
    .login-tabs span {
      flex: 1; text-align: center; padding: 10px 0; font-size: 14px; color: #888; cursor: pointer; position: relative;
    }
    .login-tabs span.on { color: var(--brand); font-weight: 650; }
    .login-tabs span.on::after {
      content: ""; position: absolute; left: 28%; right: 28%; bottom: 0; height: 2px; background: var(--brand); border-radius: 2px;
    }
    .code-row { display: flex; gap: 8px; align-items: stretch; }
    .code-row input { flex: 1; }
    .code-row .code-btn {
      flex-shrink: 0; border: 1px solid var(--brand); background: #eaf4f0; color: var(--brand);
      border-radius: 10px; padding: 0 12px; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; white-space: nowrap;
    }
    .code-row .code-btn:disabled { opacity: .5; cursor: not-allowed; }
    .agree-row {
      display: flex; align-items: flex-start; gap: 8px; margin: 14px 0 12px; font-size: 12px; color: #888; line-height: 1.5;
    }
    .agree-row .chk-box {
      width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #ccc; flex-shrink: 0; margin-top: 1px; cursor: pointer;
    }
    .agree-row .chk-box.on { border-color: var(--brand); background: var(--brand); box-shadow: inset 0 0 0 3px #fff; }
    .agree-row a { color: var(--brand); cursor: pointer; text-decoration: none; }
    .oauth-block { margin-top: auto; padding-top: 28px; text-align: center; }
    .oauth-block .lab { font-size: 12px; color: #bbb; margin-bottom: 14px; position: relative; }
    .oauth-block .lab::before, .oauth-block .lab::after {
      content: ""; position: absolute; top: 50%; width: 28%; height: 1px; background: #eee;
    }
    .oauth-block .lab::before { left: 0; }
    .oauth-block .lab::after { right: 0; }
    .oauth-row { display: flex; justify-content: center; gap: 28px; }
    .oauth-item { text-align: center; cursor: pointer; font-size: 11px; color: #666; }
    .oauth-item .oico {
      width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center;
      color: #fff; font-size: 13px; font-weight: 700;
    }
    .oauth-item .oico.wx { background: #07c160; }
    .oauth-item .oico.qq { background: #12b7f5; }
    .oauth-item .oico.mp { background: #2f6f5e; }
    .login-hint { margin-top: 14px; text-align: center; font-size: 12px; color: #aaa; line-height: 1.5; }
    .legal-body { padding: 12px 16px 28px; font-size: 13px; color: #444; line-height: 1.7; }
    .legal-body h3 { font-size: 14px; margin: 16px 0 8px; }
    .legal-body p { margin: 0 0 10px; }

    .timeline { padding: 4px 4px 8px 8px; }
    .tl-item { display: flex; gap: 12px; position: relative; padding-bottom: 16px; }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-item::before {
      content: ""; position: absolute; left: 5px; top: 12px; bottom: 0; width: 1px; background: #e8e8e8;
    }
    .tl-item:last-child::before { display: none; }
    .tl-dot {
      width: 11px; height: 11px; border-radius: 50%; background: #ddd; margin-top: 3px; flex-shrink: 0; z-index: 1;
    }
    .tl-item.on .tl-dot { background: var(--brand); box-shadow: 0 0 0 3px #eaf4f0; }
    .tl-item.on .tl-desc { color: var(--ink); font-weight: 650; }
    .tl-desc { font-size: 13px; color: #666; line-height: 1.45; }
    .tl-time { font-size: 11px; color: #aaa; margin-top: 4px; }

    .review-item { padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
    .review-item:last-child { border-bottom: 0; }
    .review-item .who { font-size: 12px; color: #888; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .review-item .stars { color: #f0a35a; letter-spacing: 1px; }
    .review-item .txt { font-size: 13px; color: #333; line-height: 1.55; }
    .review-pics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .review-pics .rp {
      width: 72px; height: 72px; border-radius: 8px; flex-shrink: 0; position: relative;
      background: #eee;
    }
    .review-pics .rp .rm {
      position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
      background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 18px; text-align: center;
      border: 0; padding: 0; cursor: pointer;
    }
    .review-upload {
      width: 72px; height: 72px; border: 1px dashed #ccc; border-radius: 8px;
      display: grid; place-items: center; color: #aaa; font-size: 24px; cursor: pointer; background: #fafafa;
    }
    .star-pick { display: flex; gap: 8px; font-size: 22px; color: #ddd; cursor: pointer; }
    .star-pick i.on { color: #f0a35a; }
    .star-pick i { font-style: normal; }

    .shop-banner {
      flex-shrink: 0;
      background: linear-gradient(135deg, #1f4f43, #3a8572 55%, #d7c4a3);
      color: #fff; padding: 0 16px 18px;
    }
    .shop-banner .shop-brand { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
    .shop-banner .back-ico {
      width: 32px; height: 32px; margin: 0; border-radius: 50%;
      background: rgba(0,0,0,.28); color: #fff;
      display: inline-grid; place-items: center;
    }
    .shop-banner .back-ico svg { width: 16px; height: 16px; transform: translateX(0.5px); }
    .shop-banner .logo {
      width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,.2);
      display: grid; place-items: center; font-size: 20px; font-weight: 750; flex-shrink: 0;
    }
    .shop-banner .name { font-size: 18px; font-weight: 750; }
    .shop-banner .sub { font-size: 12px; opacity: .9; margin-top: 4px; line-height: 1.45; }
    .shop-feed { margin: 0 12px 24px; }
    .shop-feed .goods .body { padding: 10px 10px 12px; }
    .shop-feed .goods .title { height: auto; min-height: 36px; margin-bottom: 2px; }
    .shop-feed .goods .tags { margin: 4px 0 8px; min-height: 18px; }
    .shop-feed .goods .row { align-items: baseline; gap: 6px; }
    .shop-feed .goods .sold { flex-shrink: 0; }

    /* home */
    .home-head {
      background: linear-gradient(180deg, var(--brand) 0%, #3a8572 58%, var(--bg) 100%);
      padding: 0 12px 12px; color: #fff; flex-shrink: 0;
    }
    .home-head .status { color: #fff; }
    .search-row { display: flex; gap: 8px; align-items: center; }
    .search {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: #fff; color: #999; border-radius: 999px; padding: 9px 12px; font-size: 13px; cursor: pointer;
    }
    .search b { color: var(--brand); font-size: 12px; border-right: 1px solid #eee; padding-right: 8px; }
    /* .msg 铃铛入口见 hengwu-preview-shared.css */
    .banner {
      margin-top: 12px; height: 128px; border-radius: 12px; overflow: hidden;
      background: linear-gradient(120deg, rgba(0,0,0,.15), transparent 40%), linear-gradient(135deg, #1f4f43, #4e9a82 55%, #d7c4a3);
      position: relative; color: #fff; padding: 18px 16px;
    }
    .banner .tag { display: inline-block; background: rgba(255,255,255,.2); border-radius: 999px; padding: 2px 8px; font-size: 11px; margin-bottom: 8px; }
    .banner h2 { margin: 0 0 4px; font-size: 22px; }
    .banner p { margin: 0; font-size: 12px; opacity: .9; }
    .banner .dots { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 4px; }
    .banner .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.45); display: block; }
    .banner .dots i.on { width: 14px; border-radius: 4px; background: #fff; }
    .cats {
      margin: 10px 12px 0; background: #fff; border-radius: 12px; padding: 14px 6px 8px;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 0;
    }
    .cat { text-align: center; font-size: 11px; color: #444; cursor: pointer; }
    .cat .ico {
      width: 42px; height: 42px; margin: 0 auto 6px; border-radius: 14px;
      display: grid; place-items: center; font-size: 16px; font-weight: 700; color: #fff;
    }
    .c1 .ico { background: #5a9e88; } .c2 .ico { background: #d29a5b; } .c3 .ico { background: #6d8fbf; }
    .c4 .ico { background: #c27b7b; } .c5 .ico { background: #8a7bb8; } .c6 .ico { background: #6aaa9a; }
    .c7 .ico { background: #b9896a; } .c8 .ico { background: #7a9e6d; } .c9 .ico { background: #c2a35a; }
    .c10 .ico { background: #7a8799; }
    .seckill { margin: 10px 12px; background: #fff; border-radius: 12px; padding: 12px; }
    .seckill .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .seckill .hd strong { font-size: 15px; }
    .seckill .hd strong em { font-style: normal; color: var(--price); margin-left: 4px; font-size: 12px; }
    .timer { display: flex; gap: 4px; align-items: center; font-size: 11px; color: #888; }
    .timer b { background: #222; color: #fff; border-radius: 4px; padding: 2px 5px; font-size: 11px; }
    .seckill-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sk { background: #fafafa; border-radius: 8px; overflow: hidden; text-align: center; cursor: pointer; }
    .sk .pic { height: 78px; }
    .sk .n { font-size: 11px; padding: 6px 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sk .p { color: var(--price); font-size: 13px; font-weight: 700; padding: 2px 0 8px; }
    .sk .p s { color: #bbb; font-weight: 400; font-size: 10px; margin-left: 2px; }
    .feed-hd { margin: 4px 12px 8px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
    .feed-hd span { font-size: 12px; color: var(--muted); font-weight: 400; }
    .feed { margin: 0 12px 76px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .goods { background: #fff; border-radius: 10px; overflow: hidden; cursor: pointer; }
    .goods .pic { height: 148px; }
    .goods .pic .tag {
      position: absolute; left: 6px; top: 6px; background: rgba(226,75,59,.92);
      color: #fff; font-size: 10px; border-radius: 4px; padding: 2px 5px; z-index: 1;
    }
    .goods .body { padding: 8px 8px 10px; }
    .goods .title { font-size: 13px; line-height: 1.35; height: 35px; overflow: hidden; }
    .goods .tags { margin: 6px 0; display: flex; gap: 4px; flex-wrap: wrap; }
    .goods .tags i { font-style: normal; font-size: 10px; color: var(--coupon-ink); background: var(--coupon); border-radius: 3px; padding: 1px 4px; }
    .goods .row { display: flex; justify-content: space-between; align-items: baseline; }
    .goods .price { color: var(--price); font-weight: 700; font-size: 16px; }
    .goods .price small { font-size: 11px; }
    .goods .sold { font-size: 11px; color: var(--muted); }

    /* detail */
    .gallery { height: 375px; position: relative; }
    .gallery .pic { height: 100%; }
    .gallery .back-ico, .gallery .share {
      position: absolute; top: 48px; width: 32px; height: 32px; border-radius: 50%;
      background: rgba(0,0,0,.35); color: #fff; display: inline-grid; place-items: center; cursor: pointer;
    }
    .gallery .back-ico { left: 12px; margin: 0; }
    .gallery .back-ico svg { width: 16px; height: 16px; transform: translateX(0.5px); }
    .gallery .share { right: 12px; font-size: 14px; }
    .gallery .pager {
      position: absolute; right: 12px; bottom: 12px; background: rgba(0,0,0,.45);
      color: #fff; border-radius: 999px; font-size: 11px; padding: 2px 8px;
    }
    .price-block { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .price-block .now { color: var(--price); font-size: 26px; font-weight: 750; }
    .price-block .now small { font-size: 14px; }
    .price-block .old { color: #bbb; text-decoration: line-through; font-size: 13px; }
    .price-block .sold { margin-left: auto; color: var(--muted); font-size: 12px; }
    .d-title { font-size: 16px; font-weight: 650; line-height: 1.4; margin-bottom: 8px; }
    .d-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .d-tags i { font-style: normal; font-size: 11px; color: var(--coupon-ink); background: var(--coupon); border: 1px solid #f0d2ba; border-radius: 3px; padding: 2px 6px; }
    .shop { display: flex; gap: 10px; align-items: center; background: #fff; padding: 12px; margin: 0 0 8px; }
    .shop .logo { width: 40px; height: 40px; border-radius: 8px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; }
    .shop .enter { margin-left: auto; border: 1px solid var(--brand); color: var(--brand); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
    .buybar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 58px;
      background: #fff; border-top: 1px solid #eee; display: grid;
      grid-template-columns: 54px 54px 54px 1fr 1fr; align-items: center;
      padding: 0 8px 8px; gap: 4px; z-index: 3;
    }
    .buybar .act { text-align: center; font-size: 10px; color: #666; cursor: pointer; }
    .buybar .act .ico { width: 20px; height: 20px; margin: 0 auto 2px; border-radius: 6px; background: #eee; }
    .buybar .cart-btn { background: #f0a35a; color: #fff; border-radius: 999px 0 0 999px; height: 38px; border: 0; font: inherit; font-size: 13px; font-weight: 650; }
    .buybar .buy-btn { background: var(--brand); color: #fff; border-radius: 0 999px 999px 0; margin-left: -4px; height: 38px; border: 0; font: inherit; font-size: 13px; font-weight: 650; }
    .sheet .shd { display: flex; gap: 10px; margin-bottom: 14px; }
    .sheet .sthumb { width: 72px; height: 72px; border-radius: 8px; flex-shrink: 0; }
    .sheet .sprice { color: var(--price); font-size: 20px; font-weight: 750; }
    .sheet .ssku { font-size: 12px; color: #888; margin-top: 4px; }

    /** 已登录，或侧栏预览中，可自由逛页；仅「未登录且不在预览」才拦 */
    function canBrowse(name) {
      if (loggedIn || guestPreview) return true;
      return !!(name && GUEST_OK.has(name));
    }
    function denyBrowse() {
      guestPreview = false;
      stack = [];
      render();
      setTimeout(() => toast("请先登录"), 30);

    function goTab(name) {
      if (!canBrowse()) { denyBrowse(); return; }
      if (!TABS.has(name)) return;
      tabRoot = name;

      render();

    function goAside(name) {
      if (name === "login" || name === "loginMp") {
        applyAuthChannel(name === "loginMp" ? "mp" : "app", { logout: true });
        return;
      }
      guestPreview = true;
      if (TABS.has(name)) {
        tabRoot = name;
        stack = [];
        pickReturn = null;
      } else {
        if (!TABS.has(tabRoot)) tabRoot = "home";
        stack = [name];
        // 侧栏直达详情类页面时给默认上下文，避免空态
        if (name === "orderDetail" || name === "logistics") {
          viewingOrderId = viewingOrderId || state.orders[0]?.id || null;
        }
        if (name === "refundApply") {
          refundOrderId = refundOrderId || state.orders.find((o) => o.status === "已完成" || o.status === "待收货")?.id || state.orders[0]?.id || null;
        }
        if (name === "reviewEdit") {
          reviewingOrderId = reviewingOrderId || state.orders.find((o) => o.status === "已完成")?.id || null;
        }
        if (name === "detail") {
          viewingProductId = viewingProductId || CATALOG[0]?.id || 1;
        }
        if (name === "withdrawAccountEdit" && editingWithdrawAccountId == null) {
          editingWithdrawAccountId = state.withdrawAccounts?.[0]?.id ?? null;
        }
        if (name === "addressEdit" && editingAddressId == null) {
          editingAddressId = state.addresses?.[0]?.id ?? null;
        }

      render();

    function push(name, opts = {}) {
      if (!canBrowse(name)) { denyBrowse(); return; }
      Object.assign(state, opts.state || {});
      if (opts.ordersTab) state.ordersTab = opts.ordersTab;
      if (opts.couponTab) state.couponTab = opts.couponTab;
      if (opts.viewingOrderId) viewingOrderId = opts.viewingOrderId;
      if (opts.refundOrderId) refundOrderId = opts.refundOrderId;
      if (opts.editingAddressId !== undefined) editingAddressId = opts.editingAddressId;
      if (opts.editingWithdrawAccountId !== undefined) editingWithdrawAccountId = opts.editingWithdrawAccountId;
      if (name === "login" || name === "loginMp") {
        applyAuthChannel(name === "loginMp" ? "mp" : "app", { logout: true });
        return;
      }
      if (loggedIn) guestPreview = false;
      if (TABS.has(name)) { goTab(name); return; }
      if (currentScreen() !== name) stack.push(name);
      render();
    }

    function previewAmount(items) {
      const goods = goodsSubtotal(items);
      const freight = goods >= 99 ? 0 : 8;
      const coupon = selectedCoupon();
      let discount = 0;
      if (coupon) {
        if (coupon.id === 1 && goods >= 99) discount = 10;
        else if (coupon.id === 2) discount = 5;
        else if (coupon.amount && goods >= 99) discount = Math.min(coupon.amount, goods);
      }
      const pay = Math.max(0, goods + freight - discount);
      return { goods, freight, discount, pay, coupon };

        if (r) {
          if (row.status) r.status = statusC;
          if (row.rejectReason) r.rejectReason = row.rejectReason;
          if (row.returnCompany != null) r.returnCompany = row.returnCompany;
          if (row.returnExpressNo != null) r.returnExpressNo = row.returnExpressNo;
        } else if (row.id && row.orderId) {
          state.refunds.unshift({
            id: row.id,
            orderId: row.orderId,
            title: row.title || "退款商品",
            amount: row.amount || 0,
            status: statusC,
            pic: row.pic || "pic-soap",
            reason: row.reason || "",
            rejectReason: row.rejectReason || "",
            returnCompany: row.returnCompany || "",
            returnExpressNo: row.returnExpressNo || ""
          });
          r = state.refunds[0];
        }
        const o = state.orders.find((x) => x.id === row.orderId);
        if (o && row.status) {
          o.refundStatus = statusC;
          if (statusC === "退款成功" || statusC === "退款中" || statusC === "待寄回" || statusC === "退货中") o.status = "退款";

        title: i.title,
        sku: i.sku,
        price: Number(i.price) || 0,
        qty: Number(i.qty) || 1,
        pic: i.pic
      }));
      const first = lines[0];
      state.orders.unshift({
        id,
        status: "待付款",
        items: lines,
        title: HP.orderTitleSummary({ items: lines }),
        sku: lines.map((i) => `${i.sku} ×${i.qty}`).join("；"),
        price: pay,
        pic: first.pic
      });
      // remove checked alive items if from cart
      if (state.checkoutFrom === "cart") {
        state.cart = state.cart.filter((c) => !(c.alive && c.checked));
      }
      pendingPay = { amount: pay, orderId: id, from: "checkout" };
      push("pay");
    }

    function paySuccess() {
      const amount = pendingPay?.amount || 0;
      if (state.balance < amount) {
        toast("余额不足，请先充值");
        return;
      }
      state.balance -= amount;
      state.balances.unshift({
        id: Date.now(), title: "订单支付", time: new Date().toLocaleString(), amount: -amount, type: "minus"
      });
      const order = orderById(pendingPay.orderId);
      if (order) order.status = "待发货";
      // consume coupon if used
      const c = selectedCoupon();
      if (c && previewAmount(state.checkoutItems).discount > 0) {
        c.status = "used";
        c.cond = "已使用";
        state.selectedCouponId = state.coupons.find((x) => x.status === "unused")?.id || null;
      }
      lastPay = { amount, orderId: pendingPay.orderId };
      pendingPay = null;
      stack = [];
      push("payResult");
    }

      if (o.status === "待收货") return `

    const renderers = {
      login: renderLogin, loginMp: renderLoginMp,
      home: renderHome, category: renderCategory, search: renderSearch,
      detail: renderDetail, cart: renderCart,
      checkout: renderCheckout, pay: renderPay, payResult: renderPayResult,
      orders: renderOrders, orderDetail: renderOrderDetail, logistics: renderLogistics,
      refundApply: renderRefundApply, refundList: renderRefundList,
      mine: renderMine, profile: renderProfile, passwordChange: renderPasswordChange,
      address: renderAddress, addressEdit: renderAddressEdit,
      coupon: renderCoupon, balance: renderBalance, withdraw: renderWithdraw,
      withdrawAccounts: renderWithdrawAccounts, withdrawAccountEdit: renderWithdrawAccountEdit,
      msgList: renderMsgList,
      shop: renderShop, reviewList: renderReviewList, reviewEdit: renderReviewEdit,
      legalUser: () => renderLegal("legalUser"),
      legalPrivacy: () => renderLegal("legalPrivacy"),
      legalShare: () => renderLegal("legalShare")
    };

    function render() {
      syncRefundsFromMerchant();
      syncPreviewSwitchers();
      const name = currentScreen();
      const html = (renderers[name] || renderHome)();
      document.getElementById("stage").innerHTML = html;
      HP.applyChannelChrome(document.querySelector("#stage .phone"), authChannel);
      syncTopTabs(name);
      const tabs = document.getElementById("tabs");
      const labels = {
        login: "App登录", loginMp: "小程序登录", home: "首页", category: "分类", search: "搜索",
        detail: "详情", cart: "购物车",
        checkout: "结算", pay: "收银台", payResult: "支付成功",
        orders: "订单", orderDetail: "订单详情", logistics: "物流",
        refundApply: "申请退款", refundList: "我的退款",
        mine: "我的", profile: "资料", passwordChange: "改密",
        address: "地址", addressEdit: "编辑地址",
        coupon: "优惠券", balance: "余额", withdraw: "提现",
        withdrawAccounts: "提现账户", withdrawAccountEdit: "编辑提现账户",
        msgList: "消息通知",
        shop: "店铺", reviewList: "评价", reviewEdit: "写评价",
        legalUser: "用户协议", legalPrivacy: "隐私政策", legalShare: "共享清单"
      };
      const ordered = {};
      SCREENS.filter((s) => labels[s]).forEach((s) => { ordered[s] = labels[s]; });
      tabs.innerHTML = HP.asideTabsHtml(ordered, name);
    }

    /* ========== events ========== */
    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-screen]");
      if (!btn) return;
      goAside(btn.dataset.screen);
    });

    document.getElementById("stage").addEventListener("click", (e) => {
      if (e.target.closest("[data-stop]") && e.target.matches("[data-sheet]")) return;
      const mask = e.target.closest("[data-sheet]");
      if (mask && e.target === mask) { closeSheet(); return; }

      const orderTab = e.target.closest("[data-order-tabs] span");
      if (orderTab) { state.ordersTab = orderTab.dataset.tab; render(); return; }

      const ctab = e.target.closest("[data-coupon-tabs] span");
      if (ctab) { state.couponTab = ctab.dataset.ctab; render(); return; }

      const opt = e.target.closest(".opt");
      if (opt) {
        const group = opt.parentElement;
        group.querySelectorAll(".opt").forEach((o) => o.classList.remove("on"));
        opt.classList.add("on");
        const groupName = group.dataset.optGroup;
        if (groupName) {
          if (!skuState.picks) skuState.picks = {};
          skuState.picks[groupName] = opt.dataset.val;
        }
        updateSkuTexts(document.querySelector(".phone.active"));
        return;
      }

      const step = e.target.closest(".stepper i[data-step]");
      if (step) {
        if (step.closest("[data-sheet-stepper]")) {
          skuState.qty = Math.max(1, skuState.qty + Number(step.dataset.step));
          updateSkuTexts(document.querySelector(".phone.active"));
          return;
        }
        const idx = Number(step.dataset.idx);
        const item = state.cart[idx];
        if (item?.alive) {
          item.qty = Math.max(1, item.qty + Number(step.dataset.step));
          render();
        }
        return;
      }

      const actionEl = e.target.closest("[data-action]");
      if (actionEl) {
        const action = actionEl.dataset.action;
        const id = actionEl.dataset.id;
        if (action === "toast") { toast(actionEl.dataset.msg || "示意"); return; }
        if (action === "open-product") {
          openProduct(actionEl.dataset.id || 1);
          return;
        }
        if (action === "open-logistics") {
          viewingOrderId = actionEl.dataset.id;
          logisticsMode = "ship";
          push("logistics");
          return;
        }
        if (action === "open-return-logistics") {
          viewingOrderId = actionEl.dataset.id;
          logisticsMode = "return";
          push("logistics");
          return;
        }
        if (action === "fill-return-express") {
          fillingReturnRefundId = actionEl.dataset.id || state.refunds.find((x) => x.orderId === actionEl.dataset.order)?.id;
          if (!stack.includes("refundList")) push("refundList");
          else render();
          return;
        }
        if (action === "cancel-return-express") {
          fillingReturnRefundId = null;
          render();
          return;
        }
        if (action === "submit-return-express") {
          const rid = fillingReturnRefundId || actionEl.dataset.id;
          const r = state.refunds.find((x) => String(x.id) === String(rid));
          if (!r) { toast("退款单不存在"); return; }
          const company = document.getElementById("return-company")?.value?.trim() || HP.EXPRESS_COMPANIES[0];
          const expressNo = document.getElementById("return-express")?.value?.trim();
          if (!expressNo) { toast("请填写退货运单号"); return; }
          r.status = "退货中";
          r.returnCompany = company;
          r.returnExpressNo = expressNo;
          const o = orderById(r.orderId);
          if (o) {
            o.refundStatus = "退货中";
            o.returnCompany = company;
            o.returnExpressNo = expressNo;
            o.returnLogistics = `${company} ${expressNo} · 退货运输中`;
          }
          HP.upsertRefundSync({
            id: r.id, orderId: r.orderId, title: r.title, amount: r.amount,
            status: "待收货", reason: r.reason, pic: r.pic,
            returnCompany: company, returnExpressNo: expressNo,
            buyer: `${state.profile.nickname} ${HP.maskPhone(state.profile.phone)}`
          });
          fillingReturnRefundId = null;
          toast("退货物流已提交");
          render();
          return;
        }
        if (action === "open-review") {
          reviewingOrderId = actionEl.dataset.id;
          reviewStars = 5;
          reviewPics = [];
          reviewTextDraft = "";
          push("reviewEdit");
          return;
        }
        if (action === "pick-star") {
          const star = e.target.closest("[data-star]");
          if (star) {
            reviewTextDraft = document.getElementById("review-text")?.value ?? reviewTextDraft;
            reviewStars = Number(star.dataset.star);
            render();
          }
          return;
        }
        if (action === "add-review-pic") {
          if (reviewPics.length >= 6) { toast("最多上传 6 张"); return; }
          reviewTextDraft = document.getElementById("review-text")?.value ?? reviewTextDraft;
          const o = orderById(reviewingOrderId);
          const items = HP.normalizeOrderItems(o || {});
          const fallback = items[0]?.pic || o?.pic || "pic-mug";
          const pool = ["pic-mug", "pic-kettle", "pic-book", "pic-bag", "pic-lamp", "pic-soap"];
          reviewPics.push(pool.includes(fallback) ? fallback : "pic-mug");
          toast("已添加图片");
          render();
          return;
        }
        if (action === "remove-review-pic") {
          reviewTextDraft = document.getElementById("review-text")?.value ?? reviewTextDraft;
          reviewPics.splice(Number(actionEl.dataset.idx), 1);
          render();
          return;
        }
        if (action === "submit-review") {
          const text = document.getElementById("review-text")?.value?.trim();
          if (!text) { toast("请填写评价内容"); return; }
          const o = orderById(reviewingOrderId);
          if (o) {
            o.reviewed = true;
            const items = HP.normalizeOrderItems(o);
            const pid = o.productId || items[0]?.productId || 1;
            if (!PRODUCT_REVIEWS[pid]) PRODUCT_REVIEWS[pid] = [];
            const nick = state.profile.nickname || "用";
            PRODUCT_REVIEWS[pid].unshift({
              user: nick[0] + "***" + (nick.length > 1 ? nick[nick.length - 1] : ""),
              stars: reviewStars,
              text,
              pics: reviewPics.slice(),
              time: "刚刚"
            });
          }
          reviewPics = [];
          reviewTextDraft = "";
          toast("评价已提交");
          back();
          return;
        }
        if (action === "toggle-cart-manage") {
          cartManaging = !cartManaging;
          if (cartManaging) state.cart.forEach((c) => { c.checked = false; });
          else state.cart.forEach((c) => { if (c.alive) c.checked = true; });
          render();
          return;
        }
        if (action === "toggle-check-manage") {
          const item = state.cart[Number(actionEl.dataset.idx)];
          if (item) { item.checked = !item.checked; render(); }
          return;
        }
        if (action === "toggle-all-manage") {
          const on = !state.cart.every((c) => c.checked);
          state.cart.forEach((c) => { c.checked = on; });
          render();
          return;
        }
        if (action === "delete-checked") {
          const n = state.cart.filter((c) => c.checked).length;
          if (!n) { toast("请先勾选商品"); return; }
          state.cart = state.cart.filter((c) => !c.checked);
          toast(`已删除 ${n} 件`);
          render();
          return;
        }
        if (action === "clear-dead") {
          const n = state.cart.filter((c) => !c.alive).length;
          state.cart = state.cart.filter((c) => c.alive);
          toast(n ? `已清理 ${n} 件失效商品` : "没有失效商品");
          render();
          return;
        }
        if (action === "read-all-notifs") {
          HP.markAllNotifsRead("c", defaultNotifs);
          toast("已全部标为已读");
          render();
          return;
        }
        if (action === "open-notif") {
          const id = actionEl.dataset.id;
          HP.markNotifRead("c", defaultNotifs, id);
          const n = loadNotifsC().find((x) => String(x.id) === String(id));
          if (!n) { render(); return; }
          if (n.go === "logistics") push("logistics", { viewingOrderId: n.orderId });
          else if (n.go === "orderDetail") push("orderDetail", { viewingOrderId: n.orderId });
          else if (n.go === "refundList") push("refundList");
          else if (n.go === "coupon") push("coupon");
          else if (n.go === "orders") push("orders", { ordersTab: n.tab || "全部" });
          else if (n.go === "balance") push("balance");
          else { toast(n.body || n.title); render(); }
          return;
        }
        if (action === "back") { back(); return; }
        if (action === "login-tab") {
          loginTab = actionEl.dataset.tab || "password";
          render();
          return;
        }
        if (action === "toggle-agree") {
          agreeLogin = !agreeLogin;
          render();
          return;
        }
        if (action === "send-sms-login") {
          if (smsCooldown > 0) return;
          toast("验证码已发送");
          startCooldown("login");
          return;
        }
        if (action === "send-sms-pwd") {
          if (pwdSmsCooldown > 0) return;
          toast("验证码已发送至 " + HP.maskPhone(state.profile.phone));
          startCooldown("pwd");
          return;
        }
        if (action === "login") {
          if (!requireAgree()) return;
          doLogin("登录成功");
          return;
        }
        if (action === "login-sms") {
          if (!requireAgree()) return;
          const code = document.getElementById("auth-code")?.value?.trim();
          if (!code) { toast("请输入验证码"); return; }
          doLogin("登录成功（新用户已自动注册）");
          return;
        }
        if (action === "mp-login-tab") {
          mpLoginTab = actionEl.dataset.tab || "wxphone";
          render();
          return;
        }
        if (action === "login-mp-phone") {
          if (!requireAgree()) return;
          doLogin("已授权微信手机号并登录");
          return;
        }
        if (action === "oauth") {
          if (!requireAgree()) return;
          const map = { wechat: "微信", qq: "QQ" };
          const p = map[actionEl.dataset.provider] || "第三方";
          doLogin(`${p}授权成功，已登录`);
          return;
        }
        if (action === "logout") { loggedIn = false; guestPreview = false; stack = []; agreeLogin = false; render(); toast("已退出"); return; }
        if (action === "sku") { openSheet(actionEl.dataset.next || "select"); return; }
        if (action === "close-sheet") { closeSheet(); return; }
        if (action === "fav") { favOn = !favOn; toast(favOn ? "已收藏" : "已取消收藏"); return; }
        if (action === "confirm-sku") {
          closeSheet();
          if (skuNext === "select") { toast("已选择规格"); render(); return; }
          if (skuNext === "add") { addToCartFromSku(); toast("已加入购物车"); render(); return; }
          if (skuNext === "buy") {
            const gBuy = productById(viewingProductId);
            const specsBuy = HP.normalizeProductSpecs(gBuy);
            startCheckout([{
              key: HP.skuPicksKey(viewingProductId, skuState.picks, specsBuy),
              productId: viewingProductId,
              title: gBuy.title,
              sku: currentSkuText("；"), price: skuState.price, qty: skuState.qty,
              pic: skuState.pic, alive: true, checked: true
            }], "buy");
            return;
          }
        }
        if (action === "toggle-check") {
          const idx = Number(actionEl.dataset.idx);
          const item = state.cart[idx];
          if (item?.alive) { item.checked = !item.checked; render(); }
          return;
        }
        if (action === "toggle-all") {
          const on = !cartAlive().every((c) => c.checked);
          cartAlive().forEach((c) => { c.checked = on; });
          render();
          return;
        }
        if (action === "checkout") {
          startCheckout(cartChecked().map((c) => ({ ...c })), "cart");
          return;
        }
        if (action === "goto-pick") {
          pickReturn = "checkout";
          push(actionEl.dataset.target || "address");
          return;
        }
        if (action === "submit-order") {
          if (!(state.checkoutItems || []).length) { toast("暂无待结算商品"); return; }
          if (!defAddr()) { toast("请选择地址"); return; }
          submitCheckout();
          return;
        }
        if (action === "pay-now") { paySuccess(); return; }
        if (action === "after-pay-home") {
          lastPay = null; stack = []; goTab("home"); return;
        }
        if (action === "after-pay-orders") {
          lastPay = null; stack = []; tabRoot = "mine";
          push("orders", { ordersTab: "待发货" }); return;
        }
        if (action === "open-search") {
          state.searchKeyword = actionEl.dataset.kw || state.searchKeyword || "";
          push("search"); return;
        }
        if (action === "do-search") {
          const input = document.getElementById("search-input");
          state.searchKeyword = input?.value?.trim() || "";
          render();
          toast(state.searchKeyword ? `搜索「${state.searchKeyword}」` : "已显示全部");
          return;
        }
        if (action === "open-category") {
          state.activeCategory = actionEl.dataset.cat || "全部";
          goTab("category"); return;
        }
        if (action === "set-category") {
          state.activeCategory = actionEl.dataset.cat || "全部";
          render(); return;
        }
        if (action === "save-profile") {
          const nick = document.getElementById("profile-nickname")?.value?.trim();
          if (!nick) { toast("昵称不能为空"); return; }
          state.profile.nickname = nick;
          toast("资料已保存");
          render();
          return;
        }
        if (action === "save-password") {
          const code = document.getElementById("pwd-code")?.value?.trim() || "";
          const n1 = document.getElementById("pwd-new")?.value || "";
          const n2 = document.getElementById("pwd-new2")?.value || "";
          if (!code) { toast("请输入短信验证码"); return; }
          if (n1.length < 8) { toast("新密码至少 8 位"); return; }
          if (n1 !== n2) { toast("两次新密码不一致"); return; }
          toast("密码已修改，请妥善保管");
          back();
          return;
        }
        if (action === "pay-order") {
          const o = orderById(id);
          if (!o) return;
          const amount = HP.orderGoodsAmount(o);
          pendingPay = { amount, orderId: o.id, from: "orders" };
          state.checkoutItems = HP.normalizeOrderItems(o).map((it) => ({ ...it }));
          push("pay");
          return;
        }
        if (action === "cancel-order") {
          state.orders = state.orders.filter((o) => o.id !== id);
          toast("订单已取消");
          render();
          return;
        }
        if (action === "confirm-receive") {
          const o = orderById(id);
          if (o) { o.status = "已完成"; o.logistics = "已签收"; }
          toast("确认收货成功");
          render();
          return;
        }
        if (action === "open-order") {
          push("orderDetail", { viewingOrderId: id });
          return;
        }
        if (action === "apply-refund") {
          push("refundApply", { refundOrderId: id });
          return;
        }
        if (action === "submit-refund") {
          const o = orderById(id);
          if (o) {
            o.status = "退款";
            o.refundStatus = "退款中";
            const reason = document.getElementById("refund-reason")?.value || HP.REFUND_REASONS[0];
            const items = HP.normalizeOrderItems(o);
            const refund = {
              id: genId("RF"), orderId: o.id, title: HP.orderTitleSummary(o),
              amount: HP.orderGoodsAmount(o), status: "退款中", pic: items[0]?.pic || o.pic, reason
            };
            state.refunds.unshift(refund);
            HP.upsertRefundSync({
              id: refund.id,
              orderId: refund.orderId,
              title: refund.title,
              amount: refund.amount,
              status: "待处理",
              reason: refund.reason,
              pic: refund.pic,
              buyer: `${state.profile.nickname} ${HP.maskPhone(state.profile.phone)}`
            });
          }
          toast("退款已提交");
          stack = stack.filter((s) => s !== "refundApply");
          push("refundList");
          return;
        }
        if (action === "pick-address") {
          state.selectedAddressId = Number(id);
          toast("已选择地址");
          if (pickReturn === "checkout") {
            pickReturn = null;
            // 回到结算：弹出 address
            if (stack[stack.length - 1] === "address") stack.pop();
            if (!stack.includes("checkout")) stack.push("checkout");
            render();
          } else render();
          return;
        }
        if (action === "set-default-addr") {
          e.stopPropagation();
          state.addresses.forEach((a) => { a.def = a.id === Number(id); });
          state.selectedAddressId = Number(id);
          toast("已设默认");
          render();
          return;
        }
        if (action === "edit-address") {
          e.stopPropagation();
          push("addressEdit", { editingAddressId: id ? Number(id) : null });
          return;
        }
        if (action === "del-address") {
          e.stopPropagation();
          state.addresses = state.addresses.filter((a) => a.id !== Number(id));
          toast("已删除");
          render();
          return;
        }
        if (action === "save-address") {
          const name = document.getElementById("addr-name")?.value?.trim() || "收货人";
          const phone = document.getElementById("addr-phone")?.value?.trim() || "";
          const region = document.getElementById("addr-region")?.value?.trim() || "";
          const detail = document.getElementById("addr-detail")?.value?.trim() || "";
          if (editingAddressId) {
            const a = state.addresses.find((x) => x.id === editingAddressId);
            if (a) Object.assign(a, { name, phone, region, detail });
          } else {
            const nid = Date.now();
            state.addresses.push({ id: nid, name, phone, region, detail, def: state.addresses.length === 0 });
            state.selectedAddressId = nid;
          }
          toast("已保存");
          back();
          return;
        }
        if (action === "pick-coupon") {
          state.selectedCouponId = Number(id);
          toast("已选择优惠券");
          if (pickReturn === "checkout") {
            pickReturn = null;
            if (stack[stack.length - 1] === "coupon") stack.pop();
            if (!stack.includes("checkout")) stack.push("checkout");
            render();
          } else render();
          return;
        }
        if (action === "recharge") {
          state.balance += 100;
          state.balances.unshift({
            id: Date.now(), title: "余额充值", time: new Date().toLocaleString(), amount: 100, type: "plus"
          });
          toast("充值成功 +100");
          render();
          return;
        }
        if (action === "open-withdraw-accounts") {
          pickReturn = "withdraw";
          push("withdrawAccounts");
          return;
        }
        if (action === "pick-withdraw-account") {
          state.selectedWithdrawAccountId = Number(id);
          toast("已选择提现账户");
          if (pickReturn === "withdraw") {
            pickReturn = null;
            if (stack[stack.length - 1] === "withdrawAccounts") stack.pop();
            if (!stack.includes("withdraw")) stack.push("withdraw");
            render();
          } else render();
          return;
        }
        if (action === "set-default-withdraw-account") {
          e.stopPropagation();
          (state.withdrawAccounts || []).forEach((a) => { a.def = a.id === Number(id); });
          state.selectedWithdrawAccountId = Number(id);
          toast("已设默认提现账户");
          render();
          return;
        }
        if (action === "edit-withdraw-account") {
          e.stopPropagation();
          editingWithdrawAccountId = id ? Number(id) : null;
          const allow = allowedWithdrawTypes();
          const existing = (state.withdrawAccounts || []).find((x) => x.id === editingWithdrawAccountId);
          waEditDraft = existing
            ? { type: allow.includes(existing.type) ? existing.type : allow[0], holder: existing.holder || "", bank: existing.bank || "", mask: existing.mask || "" }
            : { type: allow[0], holder: state.profile.nickname, bank: allow.includes("bank") ? "招商银行" : "", mask: "" };
          push("withdrawAccountEdit", { editingWithdrawAccountId });
          return;
        }
        if (action === "pick-wa-type") {
          waEditDraft = HP.readWithdrawFormDraft(waEditDraft, { typeOverride: actionEl.dataset.type, allow: allowedWithdrawTypes() });
          render();
          return;
        }
        if (action === "del-withdraw-account") {
          e.stopPropagation();
          const target = (state.withdrawAccounts || []).find((a) => a.id === Number(id));
          if (authChannel === "mp" && target?.type === "wechat") {
            toast("小程序需保留微信提现账户");
            return;
          }
          const visible = withdrawAccountsVisible();
          if (visible.length <= 1 && visible.some((a) => a.id === Number(id))) {
            toast("至少保留一个可用提现账户");
            return;
          }
          state.withdrawAccounts = (state.withdrawAccounts || []).filter((a) => a.id !== Number(id));
          ensureWithdrawAccountForChannel();
          const cur = currentWithdrawAccount();
          if (cur) {
            (state.withdrawAccounts || []).forEach((a) => { a.def = a.id === cur.id; });
          }
          toast("已删除");
          render();
          return;
        }
        if (action === "save-withdraw-account") {
          const allow = allowedWithdrawTypes();
          const draft = HP.readWithdrawFormDraft(waEditDraft, { allow: allowedWithdrawTypes() });
          let type = draft.type;
          if (!allow.includes(type)) {
            toast(authChannel === "mp" ? "小程序仅支持微信提现" : "不支持的提现方式");
            return;
          }
          const holder = (draft.holder || "").trim() || state.profile.nickname;
          const bank = type === "bank" ? (draft.bank || "").trim() : "";
          const mask = (draft.mask || "").trim();
          if (type === "bank" && !mask) { toast("请填写卡号"); return; }
          if (type === "bank" && !bank) { toast("请填写开户行"); return; }
          if (type === "alipay" && !mask) { toast("请填写支付宝账号"); return; }
          if (type === "wechat" && (state.withdrawAccounts || []).some((a) => a.type === "wechat" && a.id !== editingWithdrawAccountId)) {
            toast("微信零钱账户已存在");
            return;
          }
          const title = withdrawTypeLabel(type);
          if (editingWithdrawAccountId) {
            const a = (state.withdrawAccounts || []).find((x) => x.id === editingWithdrawAccountId);
            if (a) Object.assign(a, { type, title, holder, bank, mask });
          } else {
            const nid = Date.now();
            if (!state.withdrawAccounts) state.withdrawAccounts = [];
            const makeDef = withdrawAccountsVisible().length === 0;
            state.withdrawAccounts.push({ id: nid, type, title, holder, bank, mask, def: makeDef });
            if (makeDef) state.selectedWithdrawAccountId = nid;
          }
          waEditDraft = null;
          toast("提现账户已保存");
          back();
          return;
        }
        if (action === "withdraw-all") {
          const input = document.getElementById("withdraw-amount");
          if (input) {
            input.value = state.balance.toFixed(2);
            input.dispatchEvent(new Event("input", { bubbles: true }));
          }
          return;
        }
        if (action === "confirm-withdraw") {
          const acc = currentWithdrawAccount();
          if (!acc) { toast("请先添加提现账户"); push("withdrawAccounts"); return; }
          const amount = Number(document.getElementById("withdraw-amount")?.value || 0);
          if (!(amount > 0)) { toast("请输入提现金额"); return; }
          if (amount < 1) { toast("单笔最低提现 ¥1"); return; }
          if (amount > state.balance) { toast("余额不足"); return; }
          if (amount > 20000) { toast("单笔不得超过 ¥20000"); return; }
          const { fee, arrive } = HP.withdrawArrive(amount);
          if (fee >= amount) { toast("提现金额过低，无法覆盖手续费"); return; }
          state.balance = Math.round((state.balance - amount) * 100) / 100;
          state.balances.unshift({
            id: Date.now(),
            title: withdrawLedgerTitle(acc),
            time: new Date().toLocaleString(),
            amount: -amount,
            type: "minus",
            tip: `到账 ¥${arrive.toFixed(2)}，手续费 ¥${fee.toFixed(2)}`
          });
          toast(`已提交，预计到账 ¥${arrive.toFixed(2)}`);
          stack = stack.filter((s) => s !== "withdraw");
          if (!stack.includes("balance")) stack.push("balance");
          render();
          return;
        }
        return;
      }

      // 提现金额预览（input）
      if (e.target?.id === "withdraw-amount") {
        const { fee, arrive } = HP.withdrawArrive(e.target.value);
        const feeEl = document.getElementById("withdraw-fee");
        const arrEl = document.getElementById("withdraw-arrive");
        if (feeEl) feeEl.textContent = `¥${fee.toFixed(2)}`;
        if (arrEl) arrEl.textContent = `¥${arrive.toFixed(2)}`;
        return;
      }

      const goTo = e.target.closest("[data-go]");
      if (!goTo) return;
      if (e.target.closest(".stepper, .chk, .ops")) return;
      const name = goTo.dataset.go;
      const opts = {};
      if (goTo.dataset.ordersTab) opts.ordersTab = goTo.dataset.ordersTab;
      if (goTo.hasAttribute("data-tab") || TABS.has(name)) { goTab(name); return; }
      push(name, opts);
    });

    HP.bindPreviewChannelSwitch((ch) => {
      applyAuthChannel(ch);
    });
    HP.bindHwSelect(document.getElementById("stage"));

    // boot: 按当前客户端展示对应登录页
    loggedIn = false;
    stack = [];
    HP.setPreviewChannel(authChannel);
    render();
  </script>
</body>
</html>
