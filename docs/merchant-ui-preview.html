<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>衡物 · 商家端预览（移动）</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --ink: #1a1a1a;
      --muted: #8c8c8c;
      --line: #eeeeee;
      --brand: #2f6f5e;
      --brand-deep: #245a4c;
      --price: #e24b3b;
      --warn: #d96b2b;
      --radius: 10px;
      --shadow: 0 16px 36px rgba(0,0,0,.14);
      --font: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); color: var(--ink); background: #ececec; min-height: 100vh; }
    .page { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
    .layout {
      display: flex; gap: 28px; align-items: flex-start; justify-content: center; flex-wrap: wrap;
    }
    .aside {
      width: 260px; flex-shrink: 0; position: sticky; top: 16px;
    }
    .aside h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.35; }
    .aside .brief { margin: 0; color: #666; font-size: 13px; line-height: 1.55; }
    .aside .meta { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: #777; }
    .aside .meta a, .aside .meta span {
      background: #fff; border: 1px solid #e5e5e5; border-radius: 999px; padding: 4px 10px; color: inherit; text-decoration: none;
    }
    .aside .meta a { color: var(--brand); }
    .aside .note { margin-top: 14px; color: #888; font-size: 12px; line-height: 1.55; }

    /* .tabs 见 hengwu-preview-shared.css */
    .stage { flex-shrink: 0; }
    .phone {
      width: 375px; height: 812px; background: var(--bg); border-radius: 40px;
      border: 11px solid #111; box-shadow: var(--shadow); overflow: hidden;
      position: relative; display: flex; flex-direction: column;
    }
    .notch {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 28px; background: #111; border-radius: 16px; z-index: 5; pointer-events: none;
    }
    .status {
      height: 44px; padding: 14px 18px 0; display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 600; flex-shrink: 0; position: relative; z-index: 2;
    }
    .scroll { flex: 1; overflow: auto; padding-bottom: 8px; }
    .scroll.with-tab { padding-bottom: 72px; }
    .scroll::-webkit-scrollbar { width: 0; }

    /* .subnav 样式见 hengwu-preview-shared.css */

    .tabbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 62px;
      background: #fff; border-top: 1px solid #eee;
      display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: 10px; z-index: 4;
    }
    .tabbar span {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 10px; color: #888; position: relative; cursor: pointer;
    }
    .tabbar span.on { color: var(--brand); font-weight: 650; }
    .tabbar .ico { width: 22px; height: 22px; border-radius: 7px; background: #ececec; }
    .tabbar span.on .ico { background: var(--brand); }
    .tabbar .badge {
      position: absolute; top: 4px; right: 10px; min-width: 14px; height: 14px;
      background: var(--price); color: #fff; border-radius: 8px; font-size: 9px;
      line-height: 14px; text-align: center; padding: 0 3px;
    }

    .toast {
      position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(8px);
      background: rgba(0,0,0,.78); color: #fff; font-size: 13px; padding: 10px 14px;
      border-radius: 8px; opacity: 0; pointer-events: none; transition: .18s ease; z-index: 40;
      white-space: nowrap; max-width: 86%; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .sheet-mask {
      position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: none;
    }
    .sheet-mask.show { display: block; }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; background: #fff;
      border-radius: 16px 16px 0 0; padding: 14px 14px 28px; z-index: 31;
      transform: translateY(105%); transition: transform .22s ease;
    }
    .sheet-mask.show .sheet { transform: translateY(0); }
    .sheet h3 { margin: 0 0 12px; font-size: 16px; }
    .sheet .acts { display: flex; gap: 8px; margin-top: 14px; }
    .sheet .acts .btn { flex: 1; }

    .btn {
      border: 0; border-radius: 999px; padding: 12px 0; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer;
    }
    .btn.solid { background: var(--brand); color: #fff; }
    .btn.outline { background: transparent; border: 1px solid var(--brand); color: var(--brand); }
    .btn.ghost { background: #fff; border: 1px solid #ddd; color: #444; }
    .btn.warn { background: #fff7f0; border: 1px solid #f0d2ba; color: var(--warn); }
    .btn.danger { background: #fff; border: 1px solid #f0b4ae; color: var(--price); }
    .btn.block { width: 100%; }
    .btn.sm { padding: 6px 12px; font-size: 12px; border-radius: 999px; }

    .panel { background: #fff; margin: 10px; border-radius: 12px; padding: 14px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input, .field textarea {
      width: 100%; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 14px;
      font: inherit; font-size: 15px; outline: none; background: #fafafa;
    }
    .field input:focus, .field textarea:focus { border-color: var(--brand); background: #fff; }
    /* 下拉 / 上传见 hengwu-preview-shared.css */

    .muted { color: var(--muted); font-size: 12px; }
    .tag {
      display: inline-block; font-size: 11px; border-radius: 4px; padding: 2px 6px; background: #f0f0f0; color: #666;
    }
    .tag.on { background: #eaf4f0; color: var(--brand); }
    .tag.off { background: #f5f5f5; color: #999; }
    .tag.wait { background: #fff7f0; color: var(--warn); }
    .tag.ok { background: #eaf4f0; color: var(--brand); }
    .tag.bad { background: #fdeceb; color: var(--price); }

    .dash-head {
      background: linear-gradient(180deg, var(--brand) 0%, #3a8572 62%, var(--bg) 100%);
      padding: 0 14px 16px; color: #fff; flex-shrink: 0;
    }
    .dash-head .status { color: #fff; }
    .dash-shop { margin-top: 4px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .dash-shop .name { font-size: 18px; font-weight: 750; }
    .dash-shop .sub { font-size: 12px; opacity: .9; margin-top: 4px; }

    /* 店铺 Tab：类「我的」，更密 */
    .shop-head {
      background: linear-gradient(180deg, var(--brand), #3f8a76);
      color: #fff; padding: 0 14px 16px; flex-shrink: 0;
    }
    .shop-head .status { color: #fff; }
    .shop-user { margin-top: 6px; display: flex; align-items: center; gap: 10px; }
    .shop-user .av {
      width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,.22);
      display: grid; place-items: center; font-weight: 750; font-size: 18px; flex-shrink: 0;
    }
    .shop-user .name { font-size: 17px; font-weight: 750; line-height: 1.25; }
    .shop-user .sub { font-size: 11px; opacity: .88; margin-top: 3px; }
    .shop-body { padding: 10px 10px 72px; display: flex; flex-direction: column; gap: 10px; }
    .shop-panel { background: #fff; border-radius: 10px; padding: 10px 8px 8px; }
    .shop-panel .phd {
      display: flex; justify-content: space-between; align-items: center;
      margin: 0 4px 8px; font-size: 13px; font-weight: 650;
    }
    .shop-panel .phd span { font-size: 11px; color: var(--muted); font-weight: 500; cursor: pointer; }
    .shop-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); text-align: center;
      font-size: 11px; color: #555; gap: 2px 0;
    }
    .shop-grid > div { cursor: pointer; padding: 6px 0 4px; position: relative; }
    .shop-grid .ico {
      width: 32px; height: 32px; margin: 0 auto 4px; border-radius: 9px;
      background: #eef5f2; color: var(--brand); display: grid; place-items: center;
      font-size: 13px; font-weight: 700;
    }
    .shop-grid .gb {
      position: absolute; top: 2px; right: calc(50% - 22px); min-width: 14px; height: 14px;
      padding: 0 3px; background: var(--price); color: #fff; border-radius: 8px;
      font-size: 9px; line-height: 14px; text-align: center;
    }
    .shop-menu { background: #fff; border-radius: 10px; overflow: hidden; }
    .shop-cell {
      margin: 0; padding: 11px 12px; display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; cursor: pointer; border-bottom: 1px solid #f3f3f3; background: #fff;
    }
    .shop-cell:last-child { border-bottom: 0; }
    .shop-cell span { color: #bbb; font-size: 12px; }
    .shop-review {
      padding: 10px 0; border-bottom: 1px solid #f5f5f5;
    }
    .shop-review:last-child { border-bottom: 0; }
    .shop-review .who { font-size: 12px; color: #888; display: flex; justify-content: space-between; margin-bottom: 4px; }
    .shop-review .stars { color: #f0a35a; letter-spacing: 1px; }
    .shop-review .prod { font-size: 12px; color: var(--brand); margin-bottom: 4px; }
    .shop-review .txt { font-size: 13px; color: #333; line-height: 1.45; }
    .shop-review .pics { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .shop-review .pics .rp.thumb { width: 56px; height: 56px; border-radius: 6px; flex-shrink: 0; }
    .stats {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 12px 0;
    }
    .stat {
      background: #fff; border-radius: 12px; padding: 14px; cursor: pointer;
      box-shadow: 0 1px 0 rgba(0,0,0,.02);
    }
    .stat .lab { font-size: 12px; color: var(--muted); }
    .stat .num { font-size: 26px; font-weight: 750; margin-top: 6px; }
    .stat .num.price { color: var(--price); font-size: 22px; }
    .stat .hint { font-size: 12px; color: var(--brand); margin-top: 8px; }

    .seg {
      display: flex; gap: 0; margin: 10px 12px 0; background: #fff; border-radius: 10px; padding: 4px; overflow: auto;
    }
    .seg button {
      flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 8px 6px;
      font: inherit; font-size: 12px; color: #666; cursor: pointer; white-space: nowrap;
    }
    .seg button.on { background: #eaf4f0; color: var(--brand); font-weight: 650; }
    .goods-body {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      padding-bottom: 62px;
    }
    .goods-body .seg { flex-shrink: 0; }
    .goods-split {
      flex: 1; min-height: 0; display: grid; grid-template-columns: 88px 1fr; margin-top: 8px;
    }
    .goods-side {
      background: #f7f7f7; overflow: auto;
    }
    .goods-side .item {
      padding: 14px 8px; text-align: center; font-size: 12px; color: #666;
      cursor: pointer; border-left: 3px solid transparent;
    }
    .goods-side .item.on {
      background: #fff; color: var(--brand); font-weight: 650; border-left-color: var(--brand);
    }
    .goods-main {
      background: #fff; overflow: auto; padding: 8px 10px 16px;
    }
    .goods-main .h {
      font-size: 13px; font-weight: 650; margin: 2px 2px 10px; color: #333;
    }
    .goods-main .list-card { margin: 0 0 10px; }

    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid #e5e5e5; background: #fff; border-radius: 999px;
      padding: 5px 8px 5px 10px; font-size: 12px; color: #444;
    }
    .chip button {
      border: 0; background: transparent; color: #999; cursor: pointer;
      font: inherit; font-size: 14px; line-height: 1; padding: 0 2px;
    }
    .chip-add {
      display: flex; gap: 6px; margin-top: 8px; align-items: center;
    }
    .chip-add input {
      flex: 1; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 10px;
      font: inherit; font-size: 13px; background: #fafafa; outline: none;
    }
    .chip-add input:focus { border-color: var(--brand); background: #fff; }
    .param-row {
      display: grid; grid-template-columns: 88px 1fr 28px; gap: 6px; margin-bottom: 8px; align-items: center;
    }
    .param-row input {
      width: 100%; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 10px;
      font: inherit; font-size: 13px; background: #fafafa; outline: none;
    }
    .param-row input:focus { border-color: var(--brand); background: #fff; }
    .edit-sec-title {
      font-size: 13px; font-weight: 650; margin: 4px 0 10px; color: #333;
      display: flex; justify-content: space-between; align-items: center;
    }
    .edit-sec-title .hint { font-size: 11px; font-weight: 500; color: var(--muted); }
    .spec-block {
      border: 1px solid #eee; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #fafafa;
    }
    .spec-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .spec-name {
      flex: 1; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 10px;
      font: inherit; font-size: 13px; font-weight: 650; background: #fff; outline: none;
    }
    .spec-name:focus { border-color: var(--brand); }

    .list-card {
      background: #fff; margin: 10px 12px; border-radius: 12px; padding: 12px;
    }
    .list-card .hd {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px;
    }
    .list-card .body { display: flex; gap: 10px; }
    .thumb {
      width: 64px; height: 64px; border-radius: 8px; flex-shrink: 0;
      background: linear-gradient(160deg, #f4f1ea, #cfd9d2 40%, #9eb5a8);
    }
    .thumb.mug { background: linear-gradient(160deg, #f4f1ea, #cfd9d2 40%, #9eb5a8); }
    .thumb.book { background: linear-gradient(160deg, #f7f0e4, #e2cba8 45%, #b98c5a); }
    .thumb.bag { background: linear-gradient(160deg, #efece8, #d5d8d3 40%, #8f9a93); }
    .thumb.kettle { background: linear-gradient(160deg, #f0eeea, #d2cdc4 42%, #8d8780); }
    .thumb.lamp { background: linear-gradient(160deg, #f6f3ec, #e8dfc8 40%, #c4ad78); }
    .thumb.soap { background: linear-gradient(160deg, #f2f7f4, #cfe0d7 45%, #7fa891); }
    .list-card .info { flex: 1; min-width: 0; }
    .list-card .title { font-size: 14px; font-weight: 600; line-height: 1.35; }
    .list-card .meta-line { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .list-card .price { margin-top: 6px; color: var(--price); font-weight: 750; font-size: 15px; }
    .list-card .ft {
      display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #f5f5f5;
    }

    .status-block { text-align: center; padding: 40px 20px 24px; }
    .status-block .ico {
      width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center;
      font-size: 28px; font-weight: 700;
    }
    .status-block .ico.wait { background: #fff7f0; color: var(--warn); }
    .status-block .ico.bad { background: #fdeceb; color: var(--price); }
    .status-block h2 { margin: 0 0 8px; font-size: 20px; }
    .status-block p { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.55; }

    .empty { text-align: center; color: var(--muted); padding: 36px 12px; font-size: 13px; }
    code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #fff; border: 1px solid #e5e5e5; border-radius: 4px; padding: 1px 5px; }
    @media (max-width: 900px) {
      .aside { position: static; width: 100%; max-width: 375px; }
    }

    .acct-bar {
      margin: 10px 12px 0; background: #fff; border-radius: 12px; padding: 12px 14px;
      display: flex; justify-content: space-between; align-items: center; font-size: 13px;
    }
    .acct-bar a { color: var(--brand); text-decoration: none; cursor: pointer; }

    /* .msg-entry 见 hengwu-preview-shared.css */
    .im-row {
      display: flex; gap: 10px; align-items: center; background: #fff; margin: 0 0 1px; padding: 12px 14px; cursor: pointer;
    }
    .im-ava {
      width: 44px; height: 44px; border-radius: 12px; background: #5a9e88; color: #fff;
      display: grid; place-items: center; font-weight: 700; flex-shrink: 0; font-size: 14px;
    }
    .im-ava.sys { background: #6d8fbf; }
    .im-row .body { flex: 1; min-width: 0; }
    .im-row .t1 { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 650; }
    .im-row .t1 time { font-size: 11px; color: var(--muted); font-weight: 400; }
    .im-row .t2 { margin-top: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .im-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--price); flex-shrink: 0; }
    .im-row .tag {
      display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px;
      background: #eef6f2; color: var(--brand); margin-right: 4px; font-weight: 650;
    }

    .wallet-head {
      margin: 10px 12px 0; background: linear-gradient(135deg, var(--brand), #3a8572);
      border-radius: 12px; padding: 16px; color: #fff;
    }
    .wallet-head .lab { font-size: 12px; opacity: .9; }
    .wallet-head .num { font-size: 28px; font-weight: 750; margin: 6px 0 12px; }
    .wallet-head .acts { display: flex; gap: 8px; }
    .wallet-head .acts button {
      border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer;
    }
    .ledger-item {
      background: #fff; margin: 0 12px 8px; border-radius: 10px; padding: 12px;
    }
    .ledger-item .row { display: flex; justify-content: space-between; font-size: 14px; }
    .ledger-item .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .amt-plus { color: var(--brand); font-weight: 700; }
    .amt-minus { color: var(--price); font-weight: 700; }
  </style>
  <link rel="stylesheet" href="./hengwu-preview-shared.css" />
</head>
<body>
  <div class="page">
    <div class="layout">
      <aside class="aside">
        <h1>衡物 · 商家端</h1>
        <p class="brief">移动经营后台：入驻 → 工作台 / 商品 / 订单 / 店铺；售后在订单内处理。消息为经营通知。与 C 端同一账号，无单独登录。</p>
        <div id="preview-switchers"></div>
        <div class="meta">
          <span>单账号双端</span>
          <a href="?reset=1" id="reset-settle">重置入驻</a>
        </div>
        <div class="tabs" id="tabs"></div>
        <p class="note">左侧可切换角色与客户端，点屏快捷跳转；右侧机框可一眼看全。审核页可用「通过 / 驳回」推进演示。</p>
      </aside>
      <div class="stage">
        <div class="phone" id="phone"></div>
      </div>
    </div>
  </div>

  <script src="./hengwu-preview-shared.js"></script>
  <script>
    const HP = window.HengwuPreview;
    const ACCOUNT = { phone: "13800000001", name: "林晓薇" };
    const STORE_KEY = "hengwu-merchant-v2";
    const PRODUCT_CATEGORIES = HP.PRODUCT_CATEGORIES;
    const BUSINESS_CATEGORIES = HP.BUSINESS_CATEGORIES;
    const EXPRESS_COMPANIES = HP.EXPRESS_COMPANIES;
    const REFUND_REJECT_REASONS = HP.REFUND_REJECT_REASONS;
    const GOODS_SHELF_OPTIONS = HP.GOODS_SHELF_OPTIONS;
    const SEED_VER = 13;
    let authChannel = HP.getPreviewChannel();

    function syncPreviewSwitchers() {
      HP.mountPreviewSwitchers({ side: "m", channel: authChannel, resetId: "reset-settle" });
    }
    function applyAuthChannel(ch) {
      authChannel = HP.setPreviewChannel(ch);
      syncPreviewSwitchers();
      render();
    }
    const defaultState = () => ({
      seedVer: SEED_VER,
      settleStatus: "none",
      shop: {
        name: "衡物官方旗舰店",
        category: "家居日用",
        contact: ACCOUNT.name,
        phone: ACCOUNT.phone,
        notice: "工作日 16:00 前付款当日发货，顺丰/中通；破损包赔，支持 7 天无理由（定制款除外）。",
        open: true
      },
      /** 店铺可提现余额（订单结算入账） */
      balance: 2864.5,
      selectedWithdrawAccountId: 1,
      withdrawAccounts: [
        { id: 1, type: "bank", bank: "招商银行", mask: "8891", holder: "衡物（深圳）贸易有限公司", def: true },
        { id: 2, type: "wechat", bank: "", mask: "", holder: "衡物官方旗舰店", def: false },
        { id: 3, type: "alipay", bank: "", mask: "138****0001", holder: "衡物（深圳）贸易有限公司", def: false }
      ],
      ledgers: [
        { id: 1, title: "订单结算 HW261030203455", time: "昨天 22:10", amount: 84, type: "plus" },

      return {

      if (o.status === "退款") {
        const rs = o.refundStatus || refundForOrder(o.id)?.status;
        if (rs === "已拒绝") return "bad";
        if (rs === "已同意") return "ok";
        return "wait";
      }
      return o.status === "待发货" ? "wait" : "ok";

    function syncRefundsFromC() {
      HP.loadRefundSync().forEach((row) => {
        if (!row?.id) return;
        const statusM = HP.mapRefundStatus("m", row.status);
        const existing = state.refunds.find((x) => x.id === row.id);
        if (existing) {
          existing.status = statusM;
          if (row.rejectReason) existing.rejectReason = row.rejectReason;
          if (row.reason) existing.reason = row.reason;
          if (row.buyer) existing.buyer = row.buyer;
          if (row.returnCompany != null) existing.returnCompany = row.returnCompany;
          if (row.returnExpressNo != null) existing.returnExpressNo = row.returnExpressNo;
        } else {
          state.refunds.unshift({
            id: row.id,
            orderId: row.orderId,
            title: row.title || "退款商品",
            amount: row.amount || 0,
            status: statusM,
            reason: row.reason || "",
            buyer: row.buyer || "买家",
            rejectReason: row.rejectReason || "",
            returnCompany: row.returnCompany || "",
            returnExpressNo: row.returnExpressNo || ""
          });
        }
        if (row.orderId) applyOrderRefundStatus(row.orderId, statusM);
      });

    function gateScreen() {
      if (state.settleStatus === "approved") return "dash";
      if (state.settleStatus === "pending") return "pending";
      if (state.settleStatus === "rejected") return "rejected";
      return "apply";
    }
    function counts() {
      return {
        ship: state.orders.filter((o) => o.status === "待发货").length,
        refund: state.refunds.filter((r) => r.status === "待处理" || r.status === "待收货").length,
        onSale: state.goods.filter((g) => goodsStatusOf(g) === "在售").length,
        pendingGoods: state.goods.filter((g) => goodsStatusOf(g) === "审核中").length,
        gmv: state.orders.filter((o) => o.status !== "待发货").reduce((s, o) => s + HP.orderGoodsAmount(o), 0)
      };
    }
    function toast(msg) {
      const el = document.querySelector("#phone .toast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove("show"), 1400);
    }

    function shell(inner, { title, back, tab = false, right = "" } = {}) {
      const c = counts();
      const orderBadge = (c.ship || 0) + (c.refund || 0);
      const tabs = [
        ["dash", "工作台"],
        ["goods", "商品"],
        ["orders", "订单", orderBadge || 0],
        ["shop", "店铺"]
      ];
      return `
        <div class="notch"></div>
        ${title ? `
          ${statusHtml()}
          ${HP.subnavHtml({ title, back: !!back, backNav: back || "", right: right || "" })}` : ""}
        ${inner}
        ${tab ? `
          <div class="tabbar">
            ${tabs.map(([k, label, badge]) => `
              <span class="${screen === k || (k === "goods" && screen === "goodsEdit") || (k === "shop" && (screen === "shopEdit" || screen === "shopReviews")) ? "on" : ""}" data-nav="${k}">
                <i class="ico"></i>${label}
                ${badge ? `<b class="badge">${badge}</b>` : ""}
              </span>`).join("")}
          </div>` : ""}
        <div class="toast"></div>
        <div class="sheet-mask ${sheet ? "show" : ""}" data-action="close-sheet">
          ${sheet ? `<div class="sheet" data-stop>${renderSheet()}</div>` : `<div class="sheet"></div>`}
        </div>`;
    }

    function renderSheet() {
      if (sheet?.type === "ship") {
        const o = state.orders.find((x) => x.id === sheet.orderId);
        const co = sheet.company || EXPRESS_COMPANIES[0];
        return `
          <h3>填写运单发货</h3>
          <div class="muted" style="margin-bottom:10px">${o?.id} · ${HP.orderTitleSummary(o || {})}</div>
          <div class="field"><label>物流公司</label>
            ${HP.hwSelectHtml("ship-co", EXPRESS_COMPANIES, co)}
          </div>
          <div class="field"><label>运单号</label>
            <input id="ship-no" placeholder="请输入运单号" value="SF${Date.now().toString().slice(-10)}" />
          </div>
          <div class="acts">
            <button class="btn ghost" data-action="close-sheet">取消</button>
            <button class="btn solid" data-action="confirm-ship">确认发货</button>
          </div>`;
      }
      if (sheet?.type === "reject-refund") {
        const r = state.refunds.find((x) => x.id === sheet.refundId);
        const reason = sheet.reason || REFUND_REJECT_REASONS[0];
        return `
          <h3>拒绝退款</h3>
          <div class="muted" style="margin-bottom:10px">${r?.id} · ${r?.title}</div>
          <div class="field"><label>拒绝原因</label>
            ${HP.hwSelectHtml("reject-reason", REFUND_REJECT_REASONS, reason)}
          </div>
          <div class="acts">
            <button class="btn ghost" data-action="close-sheet">取消</button>
            <button class="btn danger" data-action="confirm-reject-refund">确认拒绝</button>
          </div>`;
      }
      if (sheet?.type === "legal") {
        const docs = {
          settle: { title: "商家入驻协议", body: "入驻后须保证商品信息真实、发货时效达标，并配合平台售后规则处理退款与纠纷。严重违规将被清退。" },
          trade: { title: "平台交易规则", body: "订单支付后请在约定时效内发货；协商一致后方可关闭交易。虚假发货、骚扰买家等行为将被处罚。" },
          privacy: { title: "隐私政策", body: "我们仅在经营所需范围内处理买家收货信息与订单数据，不会向无关第三方出售个人信息。" }
        };
        const d = docs[sheet.doc] || docs.settle;
        return `
          <h3>${d.title}</h3>
          <div style="font-size:13px;line-height:1.65;color:#444;margin:8px 0 14px">${d.body}</div>
          <div class="acts">
            <button class="btn solid" data-action="close-sheet" style="flex:1">我知道了</button>
          </div>`;
      }
      return "";
    }

    function renderGoods() {
      const statusTab = state.goodsStatusTab || "全部";
      const catTab = state.goodsTab || "全部";
      const statusTabs = ["全部", "在售", "审核中", "已下架", "售罄"];
      const catTabs = ["全部", ...PRODUCT_CATEGORIES];
      const list = state.goods.filter((g) => {
        const st = goodsStatusOf(g);
        if (statusTab !== "全部" && st !== statusTab) return false;
        if (catTab !== "全部" && g.cat !== catTab) return false;
        return true;
      });
      return shell(`
        <div class="goods-body">
          <div class="seg">
            ${statusTabs.map((t) =>
              `<button class="${statusTab === t ? "on" : ""}" data-action="goods-status-tab" data-tab="${t}">${t}</button>`
            ).join("")}
          </div>
          <div class="goods-split">
            <div class="goods-side">
              ${catTabs.map((t) =>
                `<div class="item ${catTab === t ? "on" : ""}" data-action="goods-tab" data-tab="${t}">${t}</div>`
              ).join("")}
            </div>
            <div class="goods-main">
              <div class="h">${catTab}${statusTab !== "全部" ? ` · ${statusTab}` : ""} · ${list.length} 件</div>
              ${list.map((g) => {
                const st = goodsStatusOf(g);
                const specs = HP.normalizeProductSpecs(g);
                const skuHint = specs.map((s) => `${s.name}:${(s.values || []).join("/") || "-"}`).join(" · ");
                return `
                <div class="list-card">
                  <div class="body">
                    <div class="thumb ${g.pic}"></div>
                    <div class="info">
                      <div class="title">${g.title}</div>
                      <div class="meta-line">${g.cat || "未分类"} · ${skuHint}</div>
                      <div class="meta-line">库存 ${g.stock}${g.sales != null ? ` · 已售 ${g.sales}` : ""} · <span class="tag ${st === "在售" ? "on" : st === "审核中" || st === "售罄" ? "wait" : "off"}">${st}</span></div>
                      <div class="price">¥${g.price}${g.old ? ` <span class="muted" style="text-decoration:line-through;font-weight:400">¥${g.old}</span>` : ""}</div>
                    </div>
                  </div>
                  <div class="ft">
                    ${st === "审核中"
                      ? `<button class="btn ghost sm" data-action="goods-withdraw-audit" data-id="${g.id}">撤销审核</button>`
                      : `<button class="btn ghost sm" data-action="toggle-goods" data-id="${g.id}">${st === "在售" ? "下架" : "提交审核"}</button>`}
                    <button class="btn outline sm" data-action="edit-goods" data-id="${g.id}">编辑</button>
                  </div>
                </div>`;
              }).join("") || `<div class="empty">暂无符合条件的商品</div>`}
            </div>
          </div>
        </div>
      `, {
        title: "商品管理",
        tab: true,
        right: `<span data-action="edit-goods" data-id="">新建</span>`
      });
    }

    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-screen]");
      if (!btn) return;
      goAside(btn.dataset.screen);
    });

    document.getElementById("phone").addEventListener("click", (e) => {
      if (e.target.classList.contains("sheet-mask")) {
        sheet = null; render(); return;
      }

      const nav = e.target.closest("[data-nav]");
      if (nav) {
        if (nav.dataset.nav === "goods") goodsEditDraft = null;
        if (nav.dataset.nav === "refunds") {
          state.orderTab = "售后";
          screen = "orders";
          render();
          return;
        }
        if (nav.dataset.orderTab) state.orderTab = nav.dataset.orderTab;
        screen = nav.dataset.nav;
        render();
        return;
      }

      const actionEl = e.target.closest("[data-action]");
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      const id = actionEl.dataset.id;

      if (action === "toast") { toast(actionEl.dataset.msg || "示意"); return; }
      if (action === "close-sheet") { sheet = null; render(); return; }
      if (action === "read-all-notifs") {
        HP.markAllNotifsRead("m", defaultNotifs);
        toast("已全部标为已读");
        render();
        return;
      }
      if (action === "open-notif") {
        const nid = actionEl.dataset.id;
        HP.markNotifRead("m", defaultNotifs, nid);
        const n = loadNotifsM().find((x) => String(x.id) === String(nid));
        if (!n) { render(); return; }
        if (n.go === "orders" || n.go === "refunds") {
          if (n.tab === "售后" || n.go === "refunds") state.orderTab = "售后";
          else if (n.tab) state.orderTab = n.tab;
          screen = "orders";
        } else if (n.go === "wallet" || n.go === "withdraw" || n.go === "goods") {
          screen = n.go;
        } else {
          toast(n.body || n.title);
        }
        render();
        return;
      }

      if (action === "toggle-agree-apply") {
        agreeApply = !agreeApply;
        render();
        return;
      }
      if (action === "submit-apply") {
        if (!agreeApply) { toast("请先阅读并同意入驻相关协议"); return; }
        const name = document.getElementById("ap-name")?.value?.trim();
        if (!name) { toast("请填写店铺名称"); return; }
        const category = document.getElementById("ap-cat")?.value || BUSINESS_CATEGORIES[0];
        state.apply = {
          name,
          category,
          contact: document.getElementById("ap-contact")?.value?.trim() || ACCOUNT.name,
          phone: document.getElementById("ap-phone")?.value?.trim() || ACCOUNT.phone,
          rejectReason: ""
        };
        state.shop.name = name;
        state.shop.category = state.apply.category;
        state.settleStatus = "pending";
        save();
        screen = "pending";
        toast("已提交，等待审核");
        render();
        return;
      }
      if (action === "approve") {
        state.settleStatus = "approved";
        save();
        screen = "dash";
        toast("入驻已通过");
        render();
        return;
      }
      if (action === "reject") {
        state.settleStatus = "rejected";
        state.apply.rejectReason = "营业执照不清晰，请重新上传后提交。";
        save();
        screen = "rejected";
        render();
        return;
      }
      if (action === "reapply") {
        state.settleStatus = "none";
        save();
        screen = "apply";
        render();
        return;
      }
      if (action === "toggle-goods") {
        const g = state.goods.find((x) => String(x.id) === String(id));
        if (g) {
          const st = goodsStatusOf(g);
          if (st === "审核中") { toast("审核中请先通过或撤销"); return; }
          if (st === "在售" || (st === "售罄" && normalizeShelf(g) === "on")) {
            g.shelf = "off";
            g.on = false;
            toast("已下架");
          } else {
            g.shelf = "pending";
            g.on = false;
            toast("已提交审核");
          }
          save();
          render();
        }
        return;
      }
      if (action === "goods-withdraw-audit") {
        const g = state.goods.find((x) => String(x.id) === String(id));
        if (g) {
          g.shelf = "off";
          g.on = false;
          save();
          toast("已撤销审核");
          render();
        }
        return;
      }
      if (action === "edit-goods") {
        state.editingGoodsId = id ? Number(id) : null;
        goodsEditDraft = null;
        screen = "goodsEdit";
        render();
        return;
      }
      if (action === "goods-tab") {
        state.goodsTab = actionEl.dataset.tab || "全部";
        render();
        return;
      }
      if (action === "goods-status-tab") {
        state.goodsStatusTab = actionEl.dataset.tab || "全部";
        render();
        return;
      }
      if (action === "add-goods-chip" || action === "remove-goods-chip" || action === "add-goods-param" || action === "remove-goods-param"
        || action === "add-goods-spec" || action === "remove-goods-spec" || action === "add-goods-spec-value" || action === "remove-goods-spec-value") {
        syncGoodsDraftFromForm();
        const d = ensureGoodsDraft();
        if (action === "add-goods-chip") {
          const kind = actionEl.dataset.kind;
          const input = document.getElementById(`chip-input-${kind}`);
          const val = (input?.value || "").trim();
          if (!val) { toast("请输入内容"); return; }
          if (!Array.isArray(d[kind])) d[kind] = [];
          if (d[kind].includes(val)) { toast("已存在"); return; }
          d[kind].push(val);
        } else if (action === "remove-goods-chip") {
          const kind = actionEl.dataset.kind;
          const idx = Number(actionEl.dataset.idx);
          if (Array.isArray(d[kind])) d[kind].splice(idx, 1);
        } else if (action === "add-goods-param") {
          if (!Array.isArray(d.params)) d.params = [];
          d.params.push({ k: "", v: "" });
        } else if (action === "remove-goods-param") {
          const idx = Number(actionEl.dataset.idx);
          if (Array.isArray(d.params)) d.params.splice(idx, 1);
        } else if (action === "add-goods-spec") {
          if (!Array.isArray(d.specs)) d.specs = [];
          d.specs.push({ name: "规格" + (d.specs.length + 1), values: ["默认"] });
        } else if (action === "remove-goods-spec") {
          const idx = Number(actionEl.dataset.idx);
          if (Array.isArray(d.specs)) d.specs.splice(idx, 1);
        } else if (action === "add-goods-spec-value") {
          const idx = Number(actionEl.dataset.idx);
          const input = document.getElementById(`spec-val-${idx}`);
          const val = (input?.value || "").trim();
          if (!val) { toast("请输入规格选项"); return; }
          if (!d.specs[idx]) return;
          if (!Array.isArray(d.specs[idx].values)) d.specs[idx].values = [];
          if (d.specs[idx].values.includes(val)) { toast("已存在"); return; }
          d.specs[idx].values.push(val);
        } else if (action === "remove-goods-spec-value") {
          const idx = Number(actionEl.dataset.idx);
          const vidx = Number(actionEl.dataset.vidx);
          if (d.specs[idx]?.values) d.specs[idx].values.splice(vidx, 1);
        }
        render();
        return;
      }
      if (action === "save-goods") {
        syncGoodsDraftFromForm();
        const d = ensureGoodsDraft();
        const title = (d.title || "").trim();
        const cat = d.cat || "家居";
        if (!title) { toast("请填写商品名称"); return; }
        if (!PRODUCT_CATEGORIES.includes(cat)) { toast("请选择商品分类"); return; }
        if (!(d.specs || []).length) { toast("请至少添加一个规格类型"); return; }
        if ((d.specs || []).some((s) => !(s.values || []).length)) { toast("每个规格类型至少要有一个选项"); return; }
        if ((d.specs || []).some((s) => !(s.name || "").trim())) { toast("请填写规格类型名称"); return; }
        const row = normalizeGoods({
          ...d,
          title,
          cat,
          id: state.editingGoodsId || d.id || Date.now(),
          sales: state.editingGoodsId
            ? (state.goods.find((x) => x.id === state.editingGoodsId)?.sales || 0)
            : 0
        });
        if (state.editingGoodsId) {
          const g = state.goods.find((x) => x.id === state.editingGoodsId);
          if (g) Object.assign(g, row, { id: state.editingGoodsId });
        } else {
          state.goods.unshift(row);
        }
        goodsEditDraft = null;
        save();
        screen = "goods";
        toast("已保存");
        render();
        return;
      }
      if (action === "open-order-detail") {
        viewingOrderId = id;
        screen = "orderDetail";
        render();
        return;
      }
      if (action === "order-tab") {
        state.orderTab = actionEl.dataset.tab === "退款" ? "售后" : actionEl.dataset.tab;
        render();
        return;
      }
      if (action === "open-ship") {
        sheet = { type: "ship", orderId: id, company: EXPRESS_COMPANIES[0] };
        render();
        return;
      }
      if (action === "confirm-ship") {
        const o = state.orders.find((x) => x.id === sheet?.orderId);
        const no = document.getElementById("ship-no")?.value?.trim();
        const co = document.getElementById("ship-co")?.value || EXPRESS_COMPANIES[0];
        if (!no) { toast("请填写运单号"); return; }
        if (o) { o.status = "待收货"; o.express = `${co} ${no}`; }
        sheet = null;
        save();
        toast("已发货");
        render();
        return;
      }
      if (action === "open-legal") {
        sheet = { type: "legal", doc: actionEl.dataset.doc || "settle" };
        render();
        return;
      }
      if (action === "open-reject-refund") {
        sheet = { type: "reject-refund", refundId: id, reason: REFUND_REJECT_REASONS[0] };
        render();
        return;
      }
      if (action === "confirm-reject-refund") {
        const r = state.refunds.find((x) => x.id === sheet?.refundId);
        const reason = document.getElementById("reject-reason")?.value || REFUND_REJECT_REASONS[0];
        if (r) {
          r.status = "已拒绝";
          r.rejectReason = reason;
          applyOrderRefundStatus(r.orderId, "已拒绝");
          syncRefundToC({
            id: r.id, orderId: r.orderId, title: r.title, amount: r.amount,
            status: "已拒绝", rejectReason: reason, reason: r.reason, buyer: r.buyer
          });
        }
        sheet = null;
        save();
        toast("已拒绝退款");
        render();
        return;
      }
      if (action === "open-order-refund") {
        state.orderTab = "售后";
        screen = "orders";
        render();
        return;
      }
      if (action === "refund-approve-return") {
        const r = state.refunds.find((x) => x.id === id);
        if (r) {
          r.status = "待寄回";
          applyOrderRefundStatus(r.orderId, "待寄回");
          syncRefundToC({
            id: r.id, orderId: r.orderId, title: r.title, amount: r.amount,
            status: "待寄回", reason: r.reason, buyer: r.buyer,
            returnCompany: r.returnCompany || "", returnExpressNo: r.returnExpressNo || ""
          });
        }
        save();
        toast("已同意退货，等待买家寄回");
        render();
        return;
      }
      if (action === "refund-confirm-receive") {
        const r = state.refunds.find((x) => x.id === id);
        if (!r?.returnExpressNo) {
          toast("尚未收到退货物流，无法退款");
          return;
        }
        r.status = "已同意";
        applyOrderRefundStatus(r.orderId, "已同意");
        syncRefundToC({
          id: r.id, orderId: r.orderId, title: r.title, amount: r.amount,
          status: "已同意", reason: r.reason, buyer: r.buyer,
          returnCompany: r.returnCompany || "", returnExpressNo: r.returnExpressNo || ""
        });
        save();
        toast("已确认收货，退款已完成");
        render();
        return;
      }
      if (action === "save-shop") {
        state.shop.name = document.getElementById("shop-name")?.value?.trim() || state.shop.name;
        state.shop.notice = document.getElementById("shop-notice")?.value || "";
        state.shop.category = document.getElementById("shop-cat")?.value || BUSINESS_CATEGORIES[0];
        state.shop.open = document.getElementById("shop-open")?.value === "1";
        save();
        toast("店铺资料已保存");
        screen = "shop";
        render();
        return;
      }
      if (action === "open-withdraw-accounts") {
        withdrawPickReturn = "withdraw";
        screen = "withdrawAccounts";
        render();
        return;
      }
      if (action === "pick-withdraw-account") {
        state.selectedWithdrawAccountId = Number(id);
        save();
        toast("已选择提现账户");
        screen = withdrawPickReturn || "wallet";
        withdrawPickReturn = null;
        render();
        return;
      }
      if (action === "set-default-withdraw-account") {
        e.stopPropagation();
        (state.withdrawAccounts || []).forEach((a) => { a.def = a.id === Number(id); });
        state.selectedWithdrawAccountId = Number(id);
        save();
        toast("已设默认提现账户");
        render();
        return;
      }
      if (action === "edit-withdraw-account") {
        e.stopPropagation();
        editingWithdrawAccountId = id ? Number(id) : null;
        const existing = (state.withdrawAccounts || []).find((x) => x.id === editingWithdrawAccountId);
        waEditDraft = existing
          ? { type: normalizeWithdrawType(existing.type), holder: existing.holder || "", bank: existing.bank || "", mask: existing.mask || "" }
          : { type: authChannel === "mp" ? "wechat" : "bank", holder: "衡物（深圳）贸易有限公司", bank: authChannel === "mp" ? "" : "招商银行", mask: "" };
        screen = "withdrawAccountEdit";
        render();
        return;
      }
      if (action === "pick-wa-type") {
        waEditDraft = HP.readWithdrawFormDraft(waEditDraft, { typeOverride: actionEl.dataset.type, allow: allowedWithdrawTypes() });
        render();
        return;
      }
      if (action === "del-withdraw-account") {
        e.stopPropagation();
        const list = state.withdrawAccounts || [];
        const target = list.find((a) => a.id === Number(id));
        if (authChannel === "mp" && target && normalizeWithdrawType(target.type) === "wechat") {
          toast("小程序需保留微信提现账户");
          return;
        }
        if (list.length <= 1) { toast("至少保留一个提现账户"); return; }
        state.withdrawAccounts = list.filter((a) => a.id !== Number(id));
        if (state.selectedWithdrawAccountId === Number(id)) {
          const def = state.withdrawAccounts.find((a) => a.def) || state.withdrawAccounts[0];
          state.selectedWithdrawAccountId = def?.id;
          if (def) def.def = true;
        }
        save();
        toast("已删除");
        render();
        return;
      }
      if (action === "save-withdraw-account") {
        const draft = HP.readWithdrawFormDraft(waEditDraft, { allow: allowedWithdrawTypes() });
        const type = draft.type;
        const holder = (draft.holder || "").trim();
        const bank = type === "bank" ? (draft.bank || "").trim() : "";
        const mask = (draft.mask || "").trim();
        if (!holder) { toast(type === "bank" ? "请填写对公户名" : "请填写账户名"); return; }
        if (type === "bank" && !bank) { toast("请填写开户银行"); return; }
        if (type === "bank" && !mask) { toast("请填写卡号"); return; }
        if (type === "alipay" && !mask) { toast("请填写支付宝账号"); return; }
        if (!state.withdrawAccounts) state.withdrawAccounts = [];
        if (editingWithdrawAccountId) {
          const a = state.withdrawAccounts.find((x) => x.id === editingWithdrawAccountId);
          if (a) Object.assign(a, { type, bank, holder, mask });
        } else {
          const nid = Date.now();
          const makeDef = state.withdrawAccounts.length === 0;
          state.withdrawAccounts.push({ id: nid, type, bank, holder, mask, def: makeDef });
          if (makeDef) state.selectedWithdrawAccountId = nid;
        }
        waEditDraft = null;
        save();
        toast("提现账户已保存");
        screen = "withdrawAccounts";
        render();
        return;
      }
      if (action === "withdraw-all") {
        const input = document.getElementById("withdraw-amount");
        if (input) {
          input.value = Number(state.balance || 0).toFixed(2);
          input.dispatchEvent(new Event("input", { bubbles: true }));
        }
        return;
      }
      if (action === "confirm-withdraw") {
        const acc = currentWithdrawAccount();
        if (!acc) {
          toast("请先添加提现账户");
          withdrawPickReturn = "withdraw";
          screen = "withdrawAccounts";
          render();
          return;
        }
        if (!allowedWithdrawTypes().includes(normalizeWithdrawType(acc.type))) {
          toast(authChannel === "mp" ? "小程序仅支持微信提现" : "不支持的提现方式");
          return;
        }
        const amount = Number(document.getElementById("withdraw-amount")?.value || 0);
        if (!(amount > 0)) { toast("请输入提现金额"); return; }
        if (amount < 1) { toast("单笔最低提现 ¥1"); return; }
        if (amount > Number(state.balance || 0)) { toast("余额不足"); return; }
        if (amount > 50000) { toast("单笔不得超过 ¥50000"); return; }
        const { fee, arrive } = HP.withdrawArrive(amount);
        if (fee >= amount) { toast("提现金额过低，无法覆盖手续费"); return; }
        state.balance = Math.round((Number(state.balance) - amount) * 100) / 100;
        if (!Array.isArray(state.ledgers)) state.ledgers = [];
        state.ledgers.unshift({
          id: Date.now(),
          title: withdrawLedgerTitle(acc),
          time: new Date().toLocaleString(),
          amount: -amount,
          type: "minus",
          tip: `到账 ¥${arrive.toFixed(2)}，手续费 ¥${fee.toFixed(2)}`
        });
        save();
        toast(`已提交，预计到账 ¥${arrive.toFixed(2)}`);
        screen = "wallet";
        render();
      }
    });

    document.getElementById("phone").addEventListener("input", (e) => {
      if (e.target?.id !== "withdraw-amount") return;
      const { fee, arrive } = HP.withdrawArrive(e.target.value);
      const feeEl = document.getElementById("withdraw-fee");
      const arrEl = document.getElementById("withdraw-arrive");
      if (feeEl) feeEl.textContent = `¥${fee.toFixed(2)}`;
      if (arrEl) arrEl.textContent = `¥${arrive.toFixed(2)}`;
    });

    if (new URLSearchParams(location.search).get("reset") === "1") {
      localStorage.removeItem(STORE_KEY);
      state = defaultState();
      screen = "apply";
    }
    authChannel = HP.setPreviewChannel(authChannel);
    HP.bindPreviewChannelSwitch((ch) => applyAuthChannel(ch));
    HP.bindHwSelect(document.getElementById("phone"));
    render();
  </script>
</body>
</html>
