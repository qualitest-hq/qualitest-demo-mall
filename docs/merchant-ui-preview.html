<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>衡物 · 商家端预览（移动）</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --ink: #1a1a1a;
      --muted: #8c8c8c;
      --line: #eeeeee;
      --brand: #2f6f5e;
      --brand-deep: #245a4c;
      --price: #e24b3b;
      --warn: #d96b2b;
      --radius: 10px;
      --shadow: 0 16px 36px rgba(0,0,0,.14);
      --font: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); color: var(--ink); background: #ececec; min-height: 100vh; }
    .page { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
    .layout {
      display: flex; gap: 28px; align-items: flex-start; justify-content: center; flex-wrap: wrap;
    }
    .aside {
      width: 260px; flex-shrink: 0; position: sticky; top: 16px;
    }
    .aside h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.35; }
    .aside .brief { margin: 0; color: #666; font-size: 13px; line-height: 1.55; }
    .aside .meta { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: #777; }
    .aside .meta a, .aside .meta span {
      background: #fff; border: 1px solid #e5e5e5; border-radius: 999px; padding: 4px 10px; color: inherit; text-decoration: none;
    }
    .aside .meta a { color: var(--brand); }
    /* .tabs 见 hengwu-preview-shared.css */
    .stage { flex-shrink: 0; }
    .phone {
      width: 375px; height: 812px; background: var(--bg); border-radius: 40px;
      border: 11px solid #111; box-shadow: var(--shadow); overflow: hidden;
      position: relative; display: flex; flex-direction: column;
    }
    .notch {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 28px; background: #111; border-radius: 16px; z-index: 5; pointer-events: none;
    }
    .status {
      height: 44px; padding: 14px 18px 0; display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 600; flex-shrink: 0; position: relative; z-index: 2;
    }
    .scroll { flex: 1; overflow: auto; padding-bottom: 8px; }
    /* 底栏留白由 HP.fitScrollToBottomBars 按实际底栏高度补齐 */
    .scroll::-webkit-scrollbar { width: 0; }

    /* .subnav 样式见 hengwu-preview-shared.css */

    .tabbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 62px;
      background: #fff; border-top: 1px solid #eee;
      display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: 10px; z-index: 4;
    }
    .tabbar span {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 10px; color: #888; position: relative; cursor: pointer;
    }
    .tabbar span.on { color: var(--brand); font-weight: 650; }
    .tabbar .ico { width: 22px; height: 22px; border-radius: 7px; background: #ececec; position: relative; }
    .tabbar span.on .ico { background: var(--brand); }
    .tabbar .badge {
      position: absolute; top: -6px; left: calc(100% - 7px); min-width: 14px; height: 14px;
      background: var(--price); color: #fff; border-radius: 8px; font-size: 9px; font-style: normal; font-weight: 650;
      line-height: 14px; text-align: center; padding: 0 3px; box-sizing: border-box; border: 1px solid #fff;
    }

    .toast {
      position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(8px);
      background: rgba(0,0,0,.78); color: #fff; font-size: 13px; padding: 10px 14px;
      border-radius: 8px; opacity: 0; pointer-events: none; transition: .18s ease; z-index: 40;
      white-space: nowrap; max-width: 86%; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .sheet-mask {
      position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: none;
    }
    .sheet-mask.show { display: block; }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; background: #fff;
      border-radius: 16px 16px 0 0; padding: 14px 14px 28px; z-index: 31;
      transform: translateY(105%); transition: transform .22s ease;
    }
    .sheet-mask.show .sheet { transform: translateY(0); }
    .sheet h3 { margin: 0 0 12px; font-size: 16px; }
    .sheet .acts { display: flex; gap: 8px; margin-top: 14px; }
    .sheet .acts .btn { flex: 1; }

    .btn {
      border: 0; border-radius: 999px; padding: 12px 0; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer;
    }
    .btn.solid { background: var(--brand); color: #fff; }
    .btn.outline { background: transparent; border: 1px solid var(--brand); color: var(--brand); }
    .btn.ghost { background: #fff; border: 1px solid #ddd; color: #444; }
    .btn.warn { background: #fff7f0; border: 1px solid #f0d2ba; color: var(--warn); }
    .btn.danger { background: #fff; border: 1px solid #f0b4ae; color: var(--price); }
    .btn.block { width: 100%; }
    .btn.sm { padding: 6px 12px; font-size: 12px; border-radius: 999px; }

    .panel { background: #fff; margin: 10px; border-radius: 12px; padding: 14px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input, .field textarea {
      width: 100%; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 14px;
      font: inherit; font-size: 15px; outline: none; background: #fafafa;
    }
    .field input:focus, .field textarea:focus { border-color: var(--brand); background: #fff; }
    /* 下拉 / 上传见 hengwu-preview-shared.css */

    .tag {
      display: inline-block; font-size: 11px; border-radius: 4px; padding: 2px 6px; background: #f0f0f0; color: #666;
    }
    .tag.on { background: #eaf4f0; color: var(--brand); }
    .tag.off { background: #f5f5f5; color: #999; }
    .tag.wait { background: #fff7f0; color: var(--warn); }
    .tag.ok { background: #eaf4f0; color: var(--brand); }
    .tag.bad { background: #fdeceb; color: var(--price); }

    /* 订单详情 */
    .od-hero { margin: 10px; border-radius: 12px; padding: 16px 14px; color: #fff; background: linear-gradient(135deg, var(--brand), #3f8a76); }
    .od-hero.warn { background: linear-gradient(135deg, #d96b2b, #e89a5a); }
    .od-hero.off { background: #9a9a9a; }
    .od-hero .st { font-size: 18px; font-weight: 700; }
    .od-hero .hint { font-size: 12px; margin-top: 6px; opacity: .92; line-height: 1.5; }
    .od-steps { display: flex; justify-content: space-between; padding: 12px 18px; }
    .od-steps .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #bbb; position: relative; }
    .od-steps .step i { width: 10px; height: 10px; border-radius: 50%; background: #ddd; position: relative; z-index: 1; }
    .od-steps .step:not(:first-child)::before {
      content: ""; position: absolute; top: 4px; right: 50%; width: 100%; height: 2px; background: #eee;
    }
    .od-steps .step.done, .od-steps .step.now { color: var(--brand); }
    .od-steps .step.done i { background: var(--brand); }
    .od-steps .step.now i { background: #fff; border: 2px solid var(--brand); width: 12px; height: 12px; margin-top: -1px; }
    .od-steps .step.done::before, .od-steps .step.now::before { background: var(--brand); }
    .od-steps .step.now span { font-weight: 650; }
    .od-sec { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 650; margin-bottom: 10px; }
    .od-link { border: 0; background: transparent; color: var(--brand); font: inherit; font-size: 12px; font-weight: 500; padding: 0; cursor: pointer; }
    .od-addr-name { font-size: 15px; font-weight: 650; }
    .od-addr-name span { font-weight: 500; color: #555; margin-left: 6px; font-size: 13px; }
    .od-addr { font-size: 13px; color: #444; line-height: 1.55; margin-top: 4px; }
    .od-remark { margin-top: 10px; padding: 8px 10px; background: #fff7f0; border-radius: 6px; font-size: 12px; color: #8a5a2a; line-height: 1.5; }
    .od-remark b { margin-right: 6px; color: var(--warn); }
    .od-item { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
    .od-item .info { flex: 1; min-width: 0; }
    .od-item .title { font-size: 13px; line-height: 1.4; }
    .od-item .meta-line { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .od-item-amt { text-align: right; font-size: 13px; }
    .od-amts { border-top: 1px solid #f0f0f0; padding-top: 10px; font-size: 13px; color: #555; }
    .od-amts > div { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .od-amts .minus { color: var(--price); }
    .od-amts .total { margin: 8px 0 0; font-weight: 650; color: #1a1a1a; }
    .od-amts .price { color: var(--price); font-size: 16px; font-weight: 750; }
    .od-line { font-size: 14px; }
    .od-info > div:not(.od-sec) { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 8px; }
    .od-info > div:not(.od-sec) span:first-child { color: var(--muted); flex-shrink: 0; }
    .od-info > div:not(.od-sec) span:last-child { text-align: right; word-break: break-all; }
    .od-acts { display: flex; gap: 8px; }
    .od-acts .btn { flex: 1; }

    .dash-head {
      background: linear-gradient(180deg, var(--brand) 0%, #3a8572 62%, var(--bg) 100%);
      padding: 0 14px 16px; color: #fff; flex-shrink: 0;
    }
    .dash-head .status { color: #fff; }
    .dash-shop { margin-top: 4px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .dash-shop .name { font-size: 18px; font-weight: 750; }
    .dash-shop .sub { font-size: 12px; opacity: .9; margin-top: 4px; }

    /* 店铺 Tab：类「我的」，更密 */
    .shop-head {
      background: linear-gradient(180deg, var(--brand), #3f8a76);
      color: #fff; padding: 0 14px 16px; flex-shrink: 0;
    }
    .shop-head .status { color: #fff; }
    .shop-user { margin-top: 6px; display: flex; align-items: center; gap: 10px; }
    .shop-user .av {
      width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,.22);
      display: grid; place-items: center; font-weight: 750; font-size: 18px; flex-shrink: 0;
    }
    .shop-user .name { font-size: 17px; font-weight: 750; line-height: 1.25; }
    .shop-user .sub { font-size: 11px; opacity: .88; margin-top: 3px; }
    .shop-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .shop-panel { background: #fff; border-radius: 10px; padding: 10px 8px 8px; }
    .shop-panel .phd {
      display: flex; justify-content: space-between; align-items: center;
      margin: 0 4px 8px; font-size: 13px; font-weight: 650;
    }
    .shop-panel .phd span { font-size: 11px; color: var(--muted); font-weight: 500; cursor: pointer; }
    .shop-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); text-align: center;
      font-size: 11px; color: #555; gap: 2px 0;
    }
    .shop-grid > div { cursor: pointer; padding: 6px 0 4px; position: relative; }
    .shop-grid .ico {
      width: 32px; height: 32px; margin: 0 auto 4px; border-radius: 9px;
      background: #eef5f2; color: var(--brand); display: grid; place-items: center;
      font-size: 13px; font-weight: 700;
    }
    .shop-grid .gb {
      position: absolute; top: 2px; right: calc(50% - 22px); min-width: 14px; height: 14px;
      padding: 0 3px; background: var(--price); color: #fff; border-radius: 8px;
      font-size: 9px; line-height: 14px; text-align: center;
    }
    .shop-menu { background: #fff; border-radius: 10px; overflow: hidden; }
    .shop-cell {
      margin: 0; padding: 11px 12px; display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; cursor: pointer; border-bottom: 1px solid #f3f3f3; background: #fff;
    }
    .shop-cell:last-child { border-bottom: 0; }
    .shop-cell span { color: #bbb; font-size: 12px; }
    .shop-review {
      padding: 10px 0; border-bottom: 1px solid #f5f5f5;
    }
    .shop-review:last-child { border-bottom: 0; }
    .shop-review .who { font-size: 12px; color: #888; display: flex; justify-content: space-between; margin-bottom: 4px; }
    .shop-review .stars { color: #f0a35a; letter-spacing: 1px; }
    .shop-review .prod { font-size: 12px; color: var(--brand); margin-bottom: 4px; }
    .shop-review .txt { font-size: 13px; color: #333; line-height: 1.45; }
    .shop-review .pics { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .shop-review .pics .rp.thumb { width: 56px; height: 56px; border-radius: 6px; flex-shrink: 0; }
    .shop-review.hidden .txt, .shop-review.hidden .pics { opacity: .5; }
    .shop-review .who .tag { margin-left: 6px; }
    .shop-review .hide-info {
      margin-top: 8px; padding: 8px 10px; background: #fff8f0; border-radius: 6px;
      font-size: 12px; color: #8a6a4a; line-height: 1.55;
    }
    .shop-review .acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .stats {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 12px 0;
    }
    .stat {
      background: #fff; border-radius: 12px; padding: 14px; cursor: pointer;
      box-shadow: 0 1px 0 rgba(0,0,0,.02);
    }
    .stat .lab { font-size: 12px; color: var(--muted); }
    .stat .num { font-size: 26px; font-weight: 750; margin-top: 6px; }
    .stat .num.price { color: var(--price); font-size: 22px; }
    .stat .hint { font-size: 12px; color: var(--brand); margin-top: 8px; }

    .seg {
      display: flex; gap: 0; margin: 10px 12px 0; background: #fff; border-radius: 10px; padding: 4px; overflow: auto;
    }
    .seg button {
      flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 8px 6px;
      font: inherit; font-size: 12px; color: #666; cursor: pointer; white-space: nowrap;
    }
    .seg button.on { background: #eaf4f0; color: var(--brand); font-weight: 650; }
    .goods-body {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      padding-bottom: 62px;
    }
    .goods-body .seg { flex-shrink: 0; }
    .goods-split {
      flex: 1; min-height: 0; display: grid; grid-template-columns: 88px 1fr; margin-top: 8px;
    }
    .goods-side {
      background: #f7f7f7; overflow: auto;
    }
    .goods-side .item {
      padding: 14px 8px; text-align: center; font-size: 12px; color: #666;
      cursor: pointer; border-left: 3px solid transparent;
    }
    .goods-side .item.on {
      background: #fff; color: var(--brand); font-weight: 650; border-left-color: var(--brand);
    }
    .goods-main {
      background: #fff; overflow: auto; padding: 8px 10px 16px;
    }
    .goods-main .h {
      font-size: 13px; font-weight: 650; margin: 2px 2px 10px; color: #333;
    }
    .goods-main .list-card { margin: 0 0 10px; }

    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid #e5e5e5; background: #fff; border-radius: 999px;
      padding: 5px 8px 5px 10px; font-size: 12px; color: #444;
    }
    .chip button {
      border: 0; background: transparent; color: #999; cursor: pointer;
      font: inherit; font-size: 14px; line-height: 1; padding: 0 2px;
    }
    .chip-add {
      display: flex; gap: 6px; margin-top: 8px; align-items: center;
    }
    .chip-add input {
      flex: 1; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 10px;
      font: inherit; font-size: 13px; background: #fafafa; outline: none;
    }
    .chip-add input:focus { border-color: var(--brand); background: #fff; }
    .param-row {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) 32px;
      gap: 8px; margin-bottom: 8px; align-items: center;
    }
    .param-row:last-child { margin-bottom: 0; }
    .param-row input {
      width: 100%; border: 1px solid #e5e5e5; border-radius: 8px; padding: 9px 10px;
      font: inherit; font-size: 13px; background: #fafafa; outline: none;
      box-sizing: border-box; min-width: 0;
    }
    .param-row input:focus { border-color: var(--brand); background: #fff; }
    .param-row .param-del {
      width: 32px; height: 32px; padding: 0; border-radius: 8px;
      display: grid; place-items: center; font-size: 16px; line-height: 1;
      color: #888; border: 1px solid #e5e5e5; background: #fff;
    }
    .param-row .param-del:hover { color: var(--price); border-color: #f0b4ae; }
    .sku-head, .sku-row {
      display: grid;
      grid-template-columns: minmax(72px, 1.2fr) repeat(3, minmax(52px, .7fr));
      gap: 6px; align-items: center; margin-bottom: 8px;
    }
    .sku-head { font-size: 11px; color: #888; padding: 0 2px; margin-bottom: 6px; }
    .sku-row .sku-lab {
      font-size: 12px; font-weight: 650; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sku-row input {
      width: 100%; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 6px;
      font: inherit; font-size: 13px; background: #fafafa; outline: none;
      box-sizing: border-box; min-width: 0;
    }
    .sku-row input:focus { border-color: var(--brand); background: #fff; }
    .sku-row.kv { grid-template-columns: minmax(72px, 1.2fr) minmax(0, 2.1fr); }
    .edit-sec-title {
      font-size: 13px; font-weight: 650; margin: 0 0 12px; color: #333;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .edit-sec-title > span:first-child { display: inline-flex; align-items: baseline; gap: 6px; min-width: 0; }
    .edit-sec-title .hint { font-size: 11px; font-weight: 500; color: var(--muted); }
    .edit-sec-title .btn { flex-shrink: 0; }
    .spec-block {
      border: 1px solid #eee; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #fafafa;
    }
    .spec-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .spec-name {
      flex: 1; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 10px;
      font: inherit; font-size: 13px; font-weight: 650; background: #fff; outline: none;
    }
    .spec-name:focus { border-color: var(--brand); }

    .list-card {
      background: #fff; margin: 10px 12px; border-radius: 12px; padding: 12px;
    }
    .list-card .hd {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px;
    }
    .list-card .body { display: flex; gap: 10px; }
    .thumb {
      width: 64px; height: 64px; border-radius: 8px; flex-shrink: 0;
      background: linear-gradient(160deg, #f4f1ea, #cfd9d2 40%, #9eb5a8);
    }
    .thumb.mug { background: linear-gradient(160deg, #f4f1ea, #cfd9d2 40%, #9eb5a8); }
    .thumb.book { background: linear-gradient(160deg, #f7f0e4, #e2cba8 45%, #b98c5a); }
    .thumb.bag { background: linear-gradient(160deg, #efece8, #d5d8d3 40%, #8f9a93); }
    .thumb.kettle { background: linear-gradient(160deg, #f0eeea, #d2cdc4 42%, #8d8780); }
    .thumb.lamp { background: linear-gradient(160deg, #f6f3ec, #e8dfc8 40%, #c4ad78); }
    .thumb.soap { background: linear-gradient(160deg, #f2f7f4, #cfe0d7 45%, #7fa891); }
    .list-card .info { flex: 1; min-width: 0; }
    .list-card .title { font-size: 14px; font-weight: 600; line-height: 1.35; }
    .list-card .meta-line { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .list-card .price { margin-top: 6px; color: var(--price); font-weight: 750; font-size: 15px; }
    .list-card .ft {
      display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #f5f5f5;
    }

    .fr-rule { border: 1px solid #eee; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #fafafa; }
    .fr-rule .rhd { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .fr-pick {
      flex: 1; min-width: 0; width: 100%; border: 1px dashed #cfd9d2; border-radius: 8px; padding: 8px 10px;
      background: #fff; font: inherit; font-size: 12px; color: #333; text-align: left; cursor: pointer; line-height: 1.5;
    }
    .fr-pick.empty { color: #aaa; }
    .fr-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .fr-grid label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; white-space: nowrap; }
    .fr-grid input {
      width: 100%; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 6px;
      font: inherit; font-size: 13px; background: #fafafa; outline: none; box-sizing: border-box; min-width: 0;
    }
    .fr-grid input:focus { border-color: var(--brand); background: #fff; }
    .fr-calc { background: #f7faf8; border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.75; color: #555; }
    .fr-calc .fee { font-size: 13px; color: #222; font-weight: 650; }

    function normalizeShelf(g) {
      if (g?.shelf === "pending" || g?.shelf === "on" || g?.shelf === "off") return g.shelf;
      return g?.on === false ? "off" : "on";
    }

    function normalizeGoods(g) {
      const shelf = normalizeShelf(g);
      const specs = HP.normalizeProductSpecs(g).map((s) => ({
        name: s.name,
        values: s.values.length ? s.values : ["默认"]
      }));
      const pic = HP.productCoverPic(g);
      const banners = HP.productBanners({ ...g, pic });
      const detailPics = HP.productDetailPics(g);
      const skus = HP.normalizeProductSkus({ ...g, specs, pic });
      const { price, old, stock } = HP.skuAggregate(skus, g?.price);
      return {
        id: g?.id ?? null,
        title: g?.title || "",
        sub: g?.sub || "",
        cat: g?.cat && PRODUCT_CATEGORIES.includes(g.cat) ? g.cat : "家居",
        price,
        old,
        stock,
        skus,
        shelf,
        on: shelf === "on",
        pic,
        banners,
        detailPics,
        sales: Number(g?.sales) || 0,
        virtualSales: Math.max(0, Math.floor(Number(g?.virtualSales) || 0)),
        tags: Array.isArray(g?.tags) ? g.tags.filter(Boolean) : [],
        ...HP.applyGoodsFreightFields(g),
        weight: Number(g?.weight) > 0 ? Number(g.weight) : null,
        specs,
        /* 兼容旧字段展示 */

          : []
      };
    }

      if (shelf === "off") return "已下架";

      return "在售";
    }

    function skuEditorHtml(skus) {

        </div>
        ${list.map((s, i) => {
          const label = Object.values(s.attrs || {}).join(" / ") || "默认";
          const price = s.price != null && s.price !== "" ? s.price : "";
          const old = s.old != null && s.old !== "" ? s.old : "";
          const stock = s.stock != null && s.stock !== "" ? s.stock : 0;
          return `<div class="sku-row">
            <div class="sku-lab" title="${label}">${label}</div>
            <input data-sku-price="${i}" type="number" step="0.01" value="${price}" placeholder="售价" />
            <input data-sku-old="${i}" type="number" step="0.01" value="${old}" placeholder="划线价" />
            <input data-sku-stock="${i}" type="number" value="${stock}" placeholder="库存" />
          </div>`;
        }).join("")}`;
    }

    /** 资料页：运费方式（模板 / 无运费 / 固定运费）；仅按重量模板才填规格重量 */
    function freightEditHtml(d) {
      const mode = HP.normalizeFreightMode(d);
      const tpls = HP.loadFreightTpls();
      const def = tpls.find((t) => t.def) || tpls[0];
      const bound = d.freightTplId != null && tpls.some((t) => String(t.id) === String(d.freightTplId));
      const tplItems = [
        { value: "", label: `跟随默认模板（${def?.name || "无"}）` },
        ...tpls.map((t) => ({ value: String(t.id), label: `${t.name} · ${t.mode === "weight" ? "按重量" : "按件数"}` }))
      ];
      const tpl = mode === "template" ? HP.freightTplOf(tpls, d.freightTplId) : null;
      const needWeight = !!(tpl && tpl.mode === "weight");
      const skus = HP.mergeProductSkus(d, d.skus);
      const fixedVal = Number(d.freightFixed) > 0 ? d.freightFixed : "";
      return `
        <div class="field"><label>运费方式</label>${HP.hwSelectHtml("g-freight-mode", HP.FREIGHT_MODE_OPTIONS, mode)}</div>
        ${mode === "template" ? `
          <div class="field"><label>运费模板</label>${HP.hwSelectHtml("g-freight-tpl", tplItems, bound ? String(d.freightTplId) : "")}</div>
          ${needWeight ? `
            <div class="sku-head" style="grid-template-columns:minmax(72px,1.6fr) minmax(0,1fr)"><span>规格</span><span>重量（kg）</span></div>

                <input data-sku-weight="${i}" type="number" min="0" step="0.01" value="${weight}" placeholder="如 0.5" />
              </div>`;
            }).join("") || `<div class="muted">请先配置销售规格</div>`}
            <div class="muted">按重量计费必须给每个规格填写重量；按件数模板不用填。</div>
          ` : `<div class="muted">当前模板按件数计费，无需填写规格重量。</div>`}
        ` : ""}
        ${mode === "none" ? `<div class="muted">结算时该商品不计运费。</div>` : ""}
        ${mode === "fixed" ? `
          <div class="field"><label>固定运费（元 / 件）</label>
            <input id="g-freight-fixed" type="number" min="0" step="0.01" value="${fixedVal}" placeholder="如 8" />
          </div>
          <div class="muted">按购买件数相加，不走运费模板与地区规则。</div>
        ` : ""}
        <div class="muted" data-freight-summary style="margin-top:8px">${opsFreightSummary(d)}</div>`;
    }

    /** 读数字输入框；空 / 非法时保留 fallback */
    function readNum(sel, fallback, { int = false } = {}) {
      const el = document.querySelector(sel);
      if (!el || el.value === "") return fallback;
      const n = Number(el.value);
      if (Number.isNaN(n)) return fallback;
      return int ? Math.max(0, Math.floor(n)) : n;
    }

    function applySkus(d, skus) {
      d.skus = skus;
      Object.assign(d, (({ price, old, stock }) => ({ price, old, stock }))(HP.skuAggregate(skus, d.price)));
    }

      d.title = titleEl.value ?? d.title;

      applySkus(d, HP.mergeProductSkus(d, d.skus).map((s, i) => {
        const wEl = document.querySelector(`[data-sku-weight="${i}"]`);
        return wEl ? { ...s, weight: Number(wEl.value) > 0 ? Number(wEl.value) : null } : s;
      }));
      const modeEl = document.getElementById("g-freight-mode");
      const tplEl = document.getElementById("g-freight-tpl");
      const fixedEl = document.getElementById("g-freight-fixed");
      Object.assign(d, HP.applyGoodsFreightFields({
        freightMode: modeEl?.value || d.freightMode,
        freightTplId: tplEl ? (tplEl.value === "" ? null : Number(tplEl.value)) : d.freightTplId,
        freightFixed: fixedEl ? (Number(fixedEl.value) > 0 ? Number(fixedEl.value) : null) : d.freightFixed
      }));
      d.weight = null;
      document.querySelectorAll("[data-spec-name]").forEach((el) => {

        const i = el.getAttribute("data-param-k");

    function opsFreightSummary(d) {
      const mode = HP.normalizeFreightMode(d);
      if (mode === "none") return "无运费：结算不计运费";
      if (mode === "fixed") {
        const fee = Number(d?.freightFixed) || 0;
        return fee > 0 ? `固定运费：¥${fee} / 件` : "固定运费：请填写金额";
      }
      const tpls = HP.loadFreightTpls();
      const tpl = HP.freightTplOf(tpls, d?.freightTplId);
      if (!tpl) return "暂无运费模板";
      const freeText = HP.freightFreeText(tpl.free);
      let weightText = "";
      if (tpl.mode === "weight") {
        const missing = HP.mergeProductSkus(d, d?.skus).filter((s) => !(Number(s.weight) > 0)).length;
        weightText = missing
          ? `；按规格重量计费，还有 ${missing} 个规格未填重量`
          : `；按规格重量计费（${HP.skuWeightText(d)}）`;
      } else {
        weightText = "；按件数计费，无需填重量";
      }
      return `运费模板「${tpl.name}」${HP.freightRuleText(tpl.base, tpl.mode)}${freeText ? `，${freeText}` : ""}${weightText}`;
    }

      let o = state.orders.find((x) => String(x.id) === String(row.id));
      const express = row.express || [row.company, row.expressNo].filter(Boolean).join(" ");

        status: row.status,
        amount: row.amount != null ? Number(row.amount) : undefined,
        title: row.title,
        buyer: row.buyer || "买家",
        paidAt: row.paidAt || "",

        refundStatus: row.refundStatus ? HP.mapRefundStatus("m", row.refundStatus) : undefined,
        returnCompany: row.returnCompany,

        discountAmount: row.discountAmount != null ? Number(row.discountAmount) : undefined,
        couponTitle: row.couponTitle || undefined,
        shippedAt: row.shippedAt || undefined
      };
      if (items.length) {
        patch.items = items;
        delete patch.title;
        // keep title summary for single-line UIs
        patch.title = row.title || HP.orderTitleSummary({ items });
      }
      Object.keys(patch).forEach((k) => { if (patch[k] === undefined) delete patch[k]; });

        if (items.length) o.items = items;

        state.orders.unshift({
          id: String(row.id),
          qty: HP.orderItemCount({ items }),
          ...patch,
          items: items.length ? items : undefined
        });
      }

      if (JSON.stringify(state.orders) !== snap) save();

    /** 发布缓存缺失或版本变了：按当前在售商品重建 C 端目录 */
    function bootstrapGoodsSync({ force = false } = {}) {
      if (!force && HP.loadGoodsSync()) return;
      HP.saveGoodsSync(state.goods.filter((g) => normalizeShelf(g) === "on").map(HP.goodsPublishSnapshot));
    }

    /** C 端支付后的库存扣减回写到本端商品（每单一次），同步增加实际销量 */
    function applyStockDeductsFromC() {
      const fresh = HP.applyStockDeducts(state.goods, state.appliedDeducts);
      if (!fresh.length) return false;
      state.goods.forEach((g) => Object.assign(g, normalizeGoods(g)));
      state.appliedDeducts = [...(state.appliedDeducts || []), ...fresh];
      save();
      return true;
    }

    /** 审核通过 → 整份发布；下架 → 撤出 C 端 */
    function publishGoods(g) {
      HP.publishGoodsSync(normalizeGoods({ ...g, shelf: "on" }));
    }

    function ensureShopLive() {
      if (!state.shopLive) state.shopLive = HP.shopPublishSnapshot(state.shop);
      return state.shopLive;
    }

    function applyShopProfile(target, src) {
      const snap = HP.shopPublishSnapshot(src);
      target.name = snap.name;
      target.category = snap.category;
      target.notice = snap.notice;
      target.open = snap.open;
      return target;
    }

    function publishShopLive() {
      state.shopLive = HP.shopPublishSnapshot(state.shop);
      HP.publishShopSync(state.shopLive);
      state.shopAudit = null;
    }

    /** 入驻通过或首次加载：把当前店铺资料推给 C 端 */
    function bootstrapShopSync({ force = false } = {}) {
      ensureShopLive();
      if (force || !HP.loadShopSync()) HP.publishShopSync(state.shopLive);
    }

    function bootstrapOrderSync() {
      state.orders.forEach((o) => {
        if (o.status === "待付款") return;
        const exists = HP.loadOrderSync().some((x) => String(x.id) === String(o.id));
        if (!exists) syncOrderToC(o, { updatedAt: Date.now() - 7 * 86400000 });
      });
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        const base = defaultState();
        const staleSeed = parsed.seedVer !== SEED_VER;
        const staleGoods = staleSeed || parsed.goodsSeedVer !== HP.GOODS_SEED_VER;
        const goods = (staleGoods ? base.goods : (Array.isArray(parsed.goods) ? parsed.goods : base.goods))
          .map(normalizeGoods);
        const shop = Object.assign({}, base.shop, parsed.shop || {});
        const shopLive = staleSeed
          ? HP.shopPublishSnapshot(shop)
          : HP.shopPublishSnapshot(parsed.shopLive || shop);
        const shopAudit = staleSeed
          ? null
          : (parsed.shopAudit && (parsed.shopAudit.status === "pending" || parsed.shopAudit.status === "rejected")
            ? { status: parsed.shopAudit.status, rejectReason: parsed.shopAudit.rejectReason || "" }
            : null);
        return Object.assign(base, parsed, {
          seedVer: SEED_VER,
          shop,
          shopLive,
          shopAudit,
          apply: Object.assign(base.apply, parsed.apply || {}),
          balance: staleSeed ? base.balance : (parsed.balance != null ? Number(parsed.balance) : base.balance),
          ledgers: staleSeed ? base.ledgers : (Array.isArray(parsed.ledgers) ? parsed.ledgers : base.ledgers),
          withdrawAccounts: staleSeed
            ? base.withdrawAccounts
            : (Array.isArray(parsed.withdrawAccounts)
              ? parsed.withdrawAccounts.map((a) => ({ ...a, type: normalizeWithdrawType(a.type) }))
              : base.withdrawAccounts),
          selectedWithdrawAccountId: staleSeed
            ? base.selectedWithdrawAccountId
            : (parsed.selectedWithdrawAccountId != null ? parsed.selectedWithdrawAccountId : base.selectedWithdrawAccountId),
          goods,
          appliedDeducts: staleGoods ? [] : (Array.isArray(parsed.appliedDeducts) ? parsed.appliedDeducts : []),
          goodsTab: parsed.goodsTab || "全部",
          goodsStatusTab: parsed.goodsStatusTab || "全部",
          orders: staleSeed ? base.orders : (Array.isArray(parsed.orders) ? parsed.orders : base.orders),
          refunds: staleSeed ? base.refunds : (Array.isArray(parsed.refunds) ? parsed.refunds : base.refunds)
        });
      } catch {
        return defaultState();
      }
    }
    function save() {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        seedVer: SEED_VER,
        goodsSeedVer: HP.GOODS_SEED_VER,
        settleStatus: state.settleStatus,
        shop: state.shop,
        shopLive: state.shopLive || HP.shopPublishSnapshot(state.shop),
        shopAudit: state.shopAudit || null,
        apply: state.apply,
        balance: state.balance,
        ledgers: state.ledgers,
        withdrawAccounts: state.withdrawAccounts,
        selectedWithdrawAccountId: state.selectedWithdrawAccountId,
        goodsTab: state.goodsTab,
        goodsStatusTab: state.goodsStatusTab || "全部",
        goods: state.goods.map(normalizeGoods),
        appliedDeducts: state.appliedDeducts || [],
        orders: state.orders,
        refunds: state.refunds
      }));
    }

    function refundForOrder(orderId) {
      return state.refunds.find((r) => String(r.orderId) === String(orderId));
    }

    function applyOrderRefundStatus(orderId, statusM) {
      const o = state.orders.find((x) => String(x.id) === String(orderId));
      if (!o) return;
      o.status = "退款";
      o.refundStatus = HP.mapRefundStatus("m", statusM);
    }

    function afterSaleLabel(statusM) {
      const rs = HP.mapRefundStatus("m", statusM);
      return rs ? `售后${rs}` : "售后";
    }

    /** 早期演示订单未带收货地址，按买家兜底 */
    const DEMO_BUYER_ADDR = {
      "周敏": { region: "广东省 广州市 海珠区", detail: "新港中路 397 号 3 栋 1203" },
      "陈浩": { region: "浙江省 杭州市 西湖区", detail: "文三路 90 号东部软件园 2 号楼 501" },
      "何雨桐": { region: "上海市 徐汇区", detail: "漕溪北路 88 号 1502 室" },
      "林晓薇": { region: "广东省 深圳市 南山区", detail: "粤海街道科技园南路 16 号深圳湾科技生态园 11 栋 A 座 1806" },
      "赵倩": { region: "江苏省 南京市 鼓楼区", detail: "中山北路 30 号 702 室" }
    };

    function orderAddress(o) {
      if (o?.address?.detail) return { ...o.address, phone: HP.maskPhone(o.address.phone) };
      const [name = "买家", phone = ""] = String(o?.buyer || "").split(/\s+/);
      const fb = DEMO_BUYER_ADDR[name] || { region: "广东省 深圳市 南山区", detail: "科技园南路 16 号" };
      return { name, phone, ...fb };
    }

    function orderDisplayStatus(o) {
      if (o.status === "退款") {
        const rs = o.refundStatus || refundForOrder(o.id)?.status;
        return afterSaleLabel(rs);
      }
      return o.status;
    }

    function orderStatusTagClass(o) {
      if (o.status === "退款") {
        const rs = o.refundStatus || refundForOrder(o.id)?.status;
        if (rs === "已拒绝") return "bad";
        if (rs === "已同意") return "ok";
        return "wait";
      }
      return o.status === "待发货" ? "wait" : "ok";
    }

    function syncRefundsFromC() {
      syncOrdersFromC();
      HP.loadRefundSync().forEach((row) => {
        if (!row?.id) return;
        const statusM = HP.mapRefundStatus("m", row.status);
        const existing = state.refunds.find((x) => x.id === row.id);
        if (existing) {
          existing.status = statusM;
          if (row.rejectReason) existing.rejectReason = row.rejectReason;
          if (row.reason) existing.reason = row.reason;
          if (row.buyer) existing.buyer = row.buyer;
          if (row.returnCompany != null) existing.returnCompany = row.returnCompany;
          if (row.returnExpressNo != null) existing.returnExpressNo = row.returnExpressNo;
        } else {
          state.refunds.unshift({
            id: row.id,
            orderId: row.orderId,
            title: row.title || "退款商品",
            amount: row.amount || 0,
            status: statusM,
            reason: row.reason || "",
            buyer: row.buyer || "买家",
            rejectReason: row.rejectReason || "",
            returnCompany: row.returnCompany || "",
            returnExpressNo: row.returnExpressNo || ""
          });
        }
        if (row.orderId) applyOrderRefundStatus(row.orderId, statusM);
      });
    }
    function gateScreen() {
      if (state.settleStatus === "approved") return "dash";
      if (state.settleStatus === "pending") return "pending";
      if (state.settleStatus === "rejected") return "rejected";
      return "apply";
    }
    function counts() {
      return {
        ship: state.orders.filter((o) => o.status === "待发货").length,
        refund: state.refunds.filter((r) => r.status === "待处理" || r.status === "待收货").length,
        onSale: state.goods.filter((g) => goodsStatusOf(g) === "在售").length,
        pendingGoods: state.goods.filter((g) => goodsStatusOf(g) === "审核中").length,
        gmv: state.orders.filter((o) => o.status !== "待发货").reduce((s, o) => s + HP.orderPayAmount(o), 0)
      };
    }
    function toast(msg) {
      const el = document.querySelector("#phone .toast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove("show"), 1400);
    }

    function shell(inner, { title, back, tab = false, right = "" } = {}) {
      const c = counts();

        ["dash", "工作台"],

        ["shop", "店铺"]

      return `
        <div class="notch"></div>
        ${title ? `
          ${statusHtml()}
          ${HP.subnavHtml({ title, back: !!back, backNav: back || "", right: right || "" })}` : ""}
        ${inner}
        ${tab ? `
          <div class="tabbar">
            ${tabs.map(([k, label, badge]) => `
              <span class="${screen === k || (k === "goods" && (screen === "goodsEdit" || screen === "goodsOps")) || (k === "shop" && ["shopEdit", "shopReviews", "freightTpls", "freightTplEdit"].includes(screen)) ? "on" : ""}" data-nav="${k}">
                <i class="ico">${badge ? `<b class="badge">${badge > 99 ? "99+" : badge}</b>` : ""}</i>${label}
              </span>`).join("")}
          </div>` : ""}
        <div class="toast"></div>
        <div class="sheet-mask ${sheet ? "show" : ""}">
          ${sheet ? `<div class="sheet" data-stop>${renderSheet()}</div>` : `<div class="sheet"></div>`}
        </div>`;
    }

            <button class="btn ghost" data-action="close-sheet">取消</button>

      if (sheet?.type === "ship") {

        return `
          <h3>填写运单发货</h3>

            ${HP.hwSelectHtml("ship-co", EXPRESS_COMPANIES, co)}

            <button class="btn solid" data-action="confirm-ship">确认发货</button>
          </div>`;
      }
      if (sheet?.type === "reject-refund") {
        const r = state.refunds.find((x) => x.id === sheet.refundId);
        const reason = sheet.reason || REFUND_REJECT_REASONS[0];
        return `
          <h3>拒绝退款</h3>
          <div class="muted" style="margin-bottom:10px">${r?.id} · ${r?.title}</div>

          </div>

            <button class="btn ghost" data-action="close-sheet">取消</button>
            <button class="btn danger" data-action="confirm-reject-refund">确认拒绝</button>
          </div>`;
      }
      if (sheet?.type === "review-reply" || sheet?.type === "review-hide") {
        const r = HP.loadReviews().find((x) => String(x.id) === String(sheet.reviewId));
        const head = `<div class="muted" style="margin-bottom:10px">${r?.user || ""} · ${"★".repeat(r?.stars || 0)} · ${r?.text || ""}</div>`;
        if (sheet.type === "review-reply") {
          return `
            <h3>${r?.reply ? "修改回复" : "回复评价"}</h3>
            ${head}
            <div class="field"><label>回复内容</label>
              <textarea id="review-reply" rows="3" maxlength="200" placeholder="回复会展示在用户端该评价下方">${r?.reply || ""}</textarea>
            </div>
            <div class="acts">
              <button class="btn ghost" data-action="close-sheet">取消</button>
              <button class="btn solid" data-action="confirm-review-reply">发布回复</button>
            </div>`;
        }
        return `
          <h3>申请隐藏评价</h3>
          ${head}
          <div class="field"><label>隐藏原因</label>
            ${HP.hwSelectHtml("review-hide-reason", HP.REVIEW_HIDE_REASONS, HP.REVIEW_HIDE_REASONS[0])}
          </div>
          <div class="field"><label>补充说明</label>
            <textarea id="review-hide-note" rows="2" maxlength="100" placeholder="选填，便于平台审核"></textarea>
          </div>
          <div class="muted" style="margin:-4px 0 12px">提交后由平台审核；通过后用户端不再展示该评价，审核期间照常展示。</div>
          <div class="acts">
            <button class="btn ghost" data-action="close-sheet">取消</button>
            <button class="btn solid" data-action="confirm-review-hide">提交审核</button>

      if (sheet?.type === "legal") {

          settle: { title: "商家入驻协议", body: "入驻后须保证商品信息真实、发货时效达标，并配合平台售后规则处理退款与纠纷。严重违规将被清退。" },
          trade: { title: "平台交易规则", body: "订单支付后请在约定时效内发货；协商一致后方可关闭交易。虚假发货、骚扰买家等行为将被处罚。" },
          privacy: { title: "隐私政策", body: "我们仅在经营所需范围内处理买家收货信息与订单数据，不会向无关第三方出售个人信息。" }
        };
        const d = docs[sheet.doc] || docs.settle;
        return `
          <h3>${d.title}</h3>
          ${HP.demoNoticeHtml()}
          <div style="font-size:13px;line-height:1.65;color:#444;margin:8px 0 14px">${d.body}</div>
          <div class="acts">
            <button class="btn solid" data-action="close-sheet" style="flex:1">我知道了</button>
          </div>`;
      }
      return "";
    }

    /** 草稿转可计算模板（空值按 0） */
    function freightTplForCalc(d) {
      const rule = (r) => ({

        first: Number(r.first) || 0, firstFee: Number(r.firstFee) || 0,
        extra: Number(r.extra) || 0, extraFee: Number(r.extraFee) || 0
      });
      return {
        ...d,
        base: rule(d.base),
        rules: d.rules.map(rule),
        free: { ...d.free, value: Number(d.free.value) || 0, exclude: (d.free.exclude || []).slice() }
      };
    }

    function freightCalcHtml(d) {
      const tpl = freightTplForCalc(d);
      const u = HP.freightUnitLabel(d.mode);
      const ship = HP.parseShipRegion(freightCalc.region);
      const qty = freightCalc.qty;
      const weight = d.mode === "weight" ? Math.round(qty * freightCalc.unitWeight * 1000) / 1000 : qty;

      const short = ship.city ? HP.regionShort(ship.city) : HP.provinceShort(ship.province);

        return `<div class="bad">${short}在不配送地区</div><div>用户端收货地址在该地区时无法提交订单</div>`;

      const freeText = HP.freightFreeText(tpl.free);

      const freeLine = r.free
        ? `已满足包邮条件（${freeText}）`

    function freightOccupied(d, target) {
      const codes = [];
      if (target === "freeExclude") {
        codes.push(...(d.noDelivery || []));

        d.rules.forEach((r, i) => {
          if (target !== `rule:${i}`) codes.push(...(r.areas || []));

        if (target !== "noDelivery") codes.push(...(d.noDelivery || []));
      }
      return HP.areaOccupiedSet(codes);
    }

    /** 保存前校验；通过返回空串 */
    function validateFreightDraft(d, tpls) {
      const name = String(d.name || "").trim();
      if (!name) return "请填写模板名称";
      if (tpls.some((t) => t.name === name && String(t.id) !== String(d.id))) return "模板名称已存在";
      const u = HP.freightUnitLabel(d.mode);
      const checkRule = (r, label) => {
        if ([r.first, r.firstFee, r.extra, r.extraFee].some((v) => v === "" || Number.isNaN(Number(v)))) return `${label}：请填写完整`;
        if (!(Number(r.first) > 0) || !(Number(r.extra) > 0)) return `${label}：${u.first}和${u.extra}必须大于 0`;
        if (d.mode === "piece" && (!Number.isInteger(Number(r.first)) || !Number.isInteger(Number(r.extra)))) return `${label}：件数须为整数`;
        if (Number(r.firstFee) < 0 || Number(r.extraFee) < 0) return `${label}：运费不能为负数`;
        return "";
      };
      const baseErr = checkRule(d.base, "默认运费");
      if (baseErr) return baseErr;
      let occupied = HP.areaOccupiedSet(d.noDelivery || []);
      for (let i = 0; i < d.rules.length; i++) {
        const r = d.rules[i];
        const areas = r.areas || [];
        if (!areas.length) return `指定地区 ${i + 1}：请选择地区`;
        const err = checkRule(r, `指定地区 ${i + 1}`);
        if (err) return err;
        const dup = areas.find((code) => occupied.has(code));
        if (dup) return `${HP.areaLabel(dup)}重复设置，同一地区只能出现在一处`;
        occupied = HP.areaOccupiedSet([...(d.noDelivery || []), ...d.rules.slice(0, i + 1).flatMap((x) => x.areas || [])]);
      }
      if (d.free.on && !(Number(d.free.value) > 0)) return "请填写包邮门槛";
      return "";
    }

    function render() {
      syncRefundsFromC();
      syncPreviewSwitchers();
      syncAsideTabs();
      const map = {
        apply: renderApply,
        pending: renderPending,
        rejected: renderRejected,
        dash: renderDash,
        goods: renderGoods,
        goodsEdit: renderGoodsEdit,
        goodsOps: renderGoodsOps,
        orders: renderOrders,
        orderDetail: renderOrderDetail,
        shop: renderShop,
        shopEdit: renderShopEdit,
        shopReviews: renderShopReviews,
        freightTpls: renderFreightTpls,
        freightTplEdit: renderFreightTplEdit,
        wallet: renderWallet,
        withdraw: renderWithdraw,
        withdrawAccounts: renderWithdrawAccounts,
        withdrawAccountEdit: renderWithdrawAccountEdit,
        msgList: renderMsgList
      };
      const phone = document.getElementById("phone");
      HP.capturePhoneScroll(phone, screen);
      phone.innerHTML = (map[screen] || renderDash)();
      HP.applyChannelChrome(phone, authChannel);
      HP.restorePhoneScroll(phone);
    }

    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-screen]");
      if (!btn) return;
      goAside(btn.dataset.screen);
    });

    document.getElementById("phone").addEventListener("click", (e) => {
      if (e.target.classList.contains("sheet-mask")) {
        sheet = null; render(); return;
      }
      /* 自定义下拉在本监听之后才写入隐藏域，延后刷新联动展示 */
      if (e.target.closest("[data-hw-dd-pick]")) {
        const pick = e.target.closest("[data-hw-dd-pick]");
        const wrap = pick?.closest("[data-hw-dd]");
        const hid = wrap?.querySelector('input[type="hidden"]')?.id;
        setTimeout(() => {
          if (screen === "freightTplEdit") {
            if (hid === "fr-calc-prov") {
              syncFreightDraftFromForm();
              const prov = document.getElementById("fr-calc-prov")?.value || "广东省";
              freightCalc.region = HP.areaCode(prov, "");
              render();
              return;
            }
            updateFreightCalc();
          }
          if (screen === "goodsEdit") {
            if (hid === "g-freight-mode" || hid === "g-freight-tpl") {
              syncGoodsDraftFromForm();
              render();
              return;
            }
            updateOpsFreightSummary();
          }
        }, 0);
      }

      const nav = e.target.closest("[data-nav]");
      if (nav) {
        if (nav.dataset.nav === "goods") {
          goodsEditDraft = null;
          goodsOpsDraft = null;
        }
        if (nav.dataset.nav === "freightTpls") freightDraft = null;
        if (nav.dataset.nav === "refunds") {
          state.orderTab = "售后";
          screen = "orders";
          render();
          return;
        }
        if (nav.dataset.orderTab) state.orderTab = nav.dataset.orderTab;
        screen = nav.dataset.nav;
        render();
        return;
      }

      const actionEl = e.target.closest("[data-action]");
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      const id = actionEl.dataset.id;

      if (action === "toast") { toast(actionEl.dataset.msg || "示意"); return; }
      if (action === "copy-text") {
        navigator.clipboard?.writeText(actionEl.dataset.text || "").catch(() => {});
        toast("已复制");
        return;
      }
      if (action === "close-sheet") { sheet = null; render(); return; }
      if (action === "read-all-notifs") {
        HP.markAllNotifsRead("m", defaultNotifs);
        toast("已全部标为已读");
        render();
        return;
      }
      if (action === "open-notif") {
        const nid = actionEl.dataset.id;
        HP.markNotifRead("m", defaultNotifs, nid);
        const n = loadNotifsM().find((x) => String(x.id) === String(nid));
        if (!n) { render(); return; }
        if (n.go === "orders" || n.go === "refunds") {
          if (n.tab === "售后" || n.go === "refunds") state.orderTab = "售后";
          else if (n.tab) state.orderTab = n.tab;
          screen = "orders";
        } else if (n.go === "wallet" || n.go === "withdraw" || n.go === "goods") {
          screen = n.go;
        } else {
          toast(n.body || n.title);
        }
        render();
        return;
      }

      if (action === "toggle-agree-apply") {
        agreeApply = !agreeApply;
        render();
        return;
      }
      if (action === "submit-apply") {
        if (!agreeApply) { toast("请先阅读并同意入驻相关协议"); return; }
        const name = document.getElementById("ap-name")?.value?.trim();
        if (!name) { toast("请填写店铺名称"); return; }
        const category = document.getElementById("ap-cat")?.value || BUSINESS_CATEGORIES[0];
        state.apply = {
          name,
          category,
          contact: document.getElementById("ap-contact")?.value?.trim() || ACCOUNT.name,
          phone: document.getElementById("ap-phone")?.value?.trim() || ACCOUNT.phone,
          rejectReason: ""
        };
        state.shop.name = name;
        state.shop.category = state.apply.category;
        state.settleStatus = "pending";
        save();
        screen = "pending";
        toast("已提交，等待审核");
        render();
        return;
      }
      if (action === "approve") {
        state.settleStatus = "approved";
        applyShopProfile(state.shop, {
          name: state.apply.name || state.shop.name,
          category: state.apply.category || state.shop.category,
          notice: state.shop.notice,
          open: true
        });
        publishShopLive();
        save();
        screen = "dash";
        toast("入驻已通过");
        render();
        return;
      }
      if (action === "reject") {
        state.settleStatus = "rejected";
        state.apply.rejectReason = "营业执照不清晰，请重新上传后提交。";
        save();
        screen = "rejected";
        render();
        return;
      }
      if (action === "reapply") {
        state.settleStatus = "none";
        save();
        screen = "apply";
        render();
        return;
      }
      if (action === "toggle-goods") {
        const g = state.goods.find((x) => String(x.id) === String(id));
        if (g) {
          const st = goodsStatusOf(g);
          if (st === "审核中") { toast("审核中请先通过或撤销"); return; }
          if (st === "在售" || (st === "售罄" && normalizeShelf(g) === "on")) {
            g.shelf = "off";
            g.on = false;
            HP.unpublishGoodsSync(g.id);
            toast("已下架，用户端不再展示");
          } else {
            g.shelf = "pending";
            g.on = false;
            toast("已提交审核");
          }
          save();

        const row = freightTplForCalc({ ...d, name: String(d.name).trim() });
        if (row.id != null && tpls.some((t) => String(t.id) === String(row.id))) {
          const i = tpls.findIndex((t) => String(t.id) === String(row.id));
          tpls[i] = { ...row, def: tpls[i].def };
        } else {
          row.id = Math.max(0, ...tpls.map((t) => Number(t.id) || 0)) + 1;
          row.def = !tpls.length;
          tpls.push(row);
        }
        HP.saveFreightTpls(tpls);
        freightDraft = null;
        editingFreightTplId = row.id;
        screen = "freightTpls";
        toast("运费模板已保存，用户端结算即时生效");
        render();
        return;
      }
      if (action === "save-shop") {
        ensureShopLive();
        state.shop.name = document.getElementById("shop-name")?.value?.trim() || state.shop.name;
        state.shop.notice = document.getElementById("shop-notice")?.value || "";
        state.shop.category = document.getElementById("shop-cat")?.value || BUSINESS_CATEGORIES[0];
        state.shop.open = document.getElementById("shop-open")?.value === "1";
        const draft = HP.shopPublishSnapshot(state.shop);
        const live = HP.shopPublishSnapshot(state.shopLive);
        if (JSON.stringify(draft) === JSON.stringify(live) && state.shopAudit?.status !== "pending") {
          state.shopAudit = null;
          save();
          toast("资料未改动");
          screen = "shop";
          render();
          return;
        }
        state.shopAudit = { status: "pending", rejectReason: "" };
        save();
        toast("已提交审核，通过前用户端仍展示旧版");
        screen = "shop";
        render();
        return;
      }
      if (action === "shop-approve-audit") {
        ensureShopLive();
        publishShopLive();
        save();
        toast("审核通过，已同步到用户端");
        screen = "shop";
        render();
        return;
      }
      if (action === "shop-withdraw-audit" || action === "shop-reject-audit") {
        ensureShopLive();
        applyShopProfile(state.shop, state.shopLive);
        const verb = action === "shop-reject-audit" ? "审核驳回" : "已撤销审核";
        if (action === "shop-reject-audit") {
          state.shopAudit = { status: "rejected", rejectReason: "店铺名称或公告不符合规范，请修改后重新提交。" };
          toast(`${verb}，已恢复线上版本`);
        } else {
          state.shopAudit = null;
          toast(verb);
        }
        save();
        render();
        return;
      }
      if (action === "open-withdraw-accounts") {
        withdrawPickReturn = "withdraw";
        screen = "withdrawAccounts";
        render();
        return;
      }
      if (action === "pick-withdraw-account") {
        state.selectedWithdrawAccountId = Number(id);
        save();
        toast("已选择提现账户");
        screen = withdrawPickReturn || "wallet";
        withdrawPickReturn = null;
        render();
        return;
      }
      if (action === "set-default-withdraw-account") {
        e.stopPropagation();
        (state.withdrawAccounts || []).forEach((a) => { a.def = a.id === Number(id); });
        state.selectedWithdrawAccountId = Number(id);
        save();
        toast("已设默认提现账户");
        render();
        return;
      }
      if (action === "edit-withdraw-account") {
        e.stopPropagation();
        editingWithdrawAccountId = id ? Number(id) : null;
        const existing = (state.withdrawAccounts || []).find((x) => x.id === editingWithdrawAccountId);
        waEditDraft = existing
          ? { type: normalizeWithdrawType(existing.type), holder: existing.holder || "", bank: existing.bank || "", mask: existing.mask || "" }
          : { type: authChannel === "mp" ? "wechat" : "bank", holder: "衡物（深圳）贸易有限公司", bank: authChannel === "mp" ? "" : "招商银行", mask: "" };
        screen = "withdrawAccountEdit";
        render();
        return;
      }
      if (action === "pick-wa-type") {
        waEditDraft = HP.readWithdrawFormDraft(waEditDraft, { typeOverride: actionEl.dataset.type, allow: allowedWithdrawTypes() });
        render();
        return;
      }
      if (action === "del-withdraw-account") {
        e.stopPropagation();
        const list = state.withdrawAccounts || [];
        const target = list.find((a) => a.id === Number(id));
        if (authChannel === "mp" && target && normalizeWithdrawType(target.type) === "wechat") {
          toast("小程序需保留微信提现账户");
          return;
        }
        if (list.length <= 1) { toast("至少保留一个提现账户"); return; }
        state.withdrawAccounts = list.filter((a) => a.id !== Number(id));
        if (state.selectedWithdrawAccountId === Number(id)) {
          const def = state.withdrawAccounts.find((a) => a.def) || state.withdrawAccounts[0];
          state.selectedWithdrawAccountId = def?.id;
          if (def) def.def = true;
        }
        save();
        toast("已删除");
        render();
        return;
      }
      if (action === "save-withdraw-account") {
        const draft = HP.readWithdrawFormDraft(waEditDraft, { allow: allowedWithdrawTypes() });
        const type = draft.type;
        const holder = (draft.holder || "").trim();
        const bank = type === "bank" ? (draft.bank || "").trim() : "";
        const mask = (draft.mask || "").trim();
        if (!holder) { toast(type === "bank" ? "请填写对公户名" : "请填写账户名"); return; }
        if (type === "bank" && !bank) { toast("请填写开户银行"); return; }
        if (type === "bank" && !mask) { toast("请填写卡号"); return; }
        if (type === "alipay" && !mask) { toast("请填写支付宝账号"); return; }
        if (!state.withdrawAccounts) state.withdrawAccounts = [];
        if (editingWithdrawAccountId) {
          const a = state.withdrawAccounts.find((x) => x.id === editingWithdrawAccountId);
          if (a) Object.assign(a, { type, bank, holder, mask });
        } else {
          const nid = Date.now();
          const makeDef = state.withdrawAccounts.length === 0;
          state.withdrawAccounts.push({ id: nid, type, bank, holder, mask, def: makeDef });
          if (makeDef) state.selectedWithdrawAccountId = nid;
        }
        waEditDraft = null;
        save();
        toast("提现账户已保存");
        screen = "withdrawAccounts";
        render();
        return;
      }
      if (action === "withdraw-all") {
        const input = document.getElementById("withdraw-amount");
        if (input) {
          input.value = Number(state.balance || 0).toFixed(2);
          input.dispatchEvent(new Event("input", { bubbles: true }));
        }
        return;
      }
      if (action === "confirm-withdraw") {
        const acc = currentWithdrawAccount();
        if (!acc) {
          toast("请先添加提现账户");
          withdrawPickReturn = "withdraw";
          screen = "withdrawAccounts";
          render();
          return;
        }
        if (!allowedWithdrawTypes().includes(normalizeWithdrawType(acc.type))) {
          toast(authChannel === "mp" ? "小程序仅支持微信提现" : "不支持的提现方式");
          return;
        }
        const amount = Number(document.getElementById("withdraw-amount")?.value || 0);
        if (!(amount > 0)) { toast("请输入提现金额"); return; }
        if (amount < 1) { toast("单笔最低提现 ¥1"); return; }
        if (amount > Number(state.balance || 0)) { toast("余额不足"); return; }
        if (amount > 50000) { toast("单笔不得超过 ¥50000"); return; }
        const { fee, arrive } = HP.withdrawArrive(amount);
        if (fee >= amount) { toast("提现金额过低，无法覆盖手续费"); return; }
        state.balance = Math.round((Number(state.balance) - amount) * 100) / 100;
        if (!Array.isArray(state.ledgers)) state.ledgers = [];
        state.ledgers.unshift({
          id: Date.now(),
          title: withdrawLedgerTitle(acc),
          time: new Date().toLocaleString(),
          amount: -amount,
          type: "minus",
          tip: `到账 ¥${arrive.toFixed(2)}，手续费 ¥${fee.toFixed(2)}`
        });
        save();
        toast(`已提交，预计到账 ¥${arrive.toFixed(2)}`);
        screen = "wallet";
        render();
      }
    });

    document.getElementById("phone").addEventListener("input", (e) => {
      if (e.target?.id === "withdraw-amount") {
        const { fee, arrive } = HP.withdrawArrive(e.target.value);
        const feeEl = document.getElementById("withdraw-fee");
        const arrEl = document.getElementById("withdraw-arrive");
        if (feeEl) feeEl.textContent = `¥${fee.toFixed(2)}`;
        if (arrEl) arrEl.textContent = `¥${arrive.toFixed(2)}`;
        return;
      }
      if (screen === "goodsOps" && e.target?.matches?.("[data-sku-price],[data-sku-old],[data-sku-stock],#g-virtual-sales")) {
        syncGoodsOpsFromForm();
        const d = ensureGoodsOpsDraft();
        const skuEl = document.querySelector("[data-sku-summary]");
        const soldEl = document.querySelector("[data-sold-summary]");
        if (skuEl) skuEl.textContent = opsSkuSummary(d);
        if (soldEl) soldEl.textContent = opsSoldSummary(d);
      }
      if (screen === "goodsEdit" && e.target?.matches?.("[data-sku-weight]")) updateOpsFreightSummary();
      if (screen === "freightTplEdit" && e.target?.matches?.("[data-fr-num],#fr-free-value,#fr-calc-qty,#fr-calc-weight,#fr-calc-amount")) {
        updateFreightCalc();
      }
    });

    const goodsSyncStale = (() => {
      try {
        return JSON.parse(localStorage.getItem(STORE_KEY) || "{}").goodsSeedVer !== HP.GOODS_SEED_VER;
      } catch {
        return true;
      }
    })();
    if (new URLSearchParams(location.search).get("reset") === "1") {
      localStorage.removeItem(STORE_KEY);
      localStorage.removeItem(HP.SHOP_SYNC_KEY);
      HP.clearStockDeducts();
      HP.clearReviews();
      HP.resetFreightTpls();
      state = defaultState();
      screen = "apply";
    }
    authChannel = HP.setPreviewChannel(authChannel);
    HP.bindPreviewChannelSwitch((ch) => applyAuthChannel(ch));
    HP.bindHwSelect(document.getElementById("phone"));
    window.addEventListener("storage", (e) => {
      if (e.key === HP.STOCK_DEDUCT_KEY) {
        if (applyStockDeductsFromC() && screen === "goodsOps") goodsOpsDraft = null;
        render();
        return;
      }
      if (e.key === HP.ORDER_SYNC_KEY || e.key === HP.REFUND_SYNC_KEY || e.key === HP.GOODS_SYNC_KEY || e.key === HP.REVIEW_SYNC_KEY || e.key === HP.FREIGHT_SYNC_KEY) render();
    });
    applyStockDeductsFromC();
    bootstrapGoodsSync({ force: goodsSyncStale || new URLSearchParams(location.search).get("reset") === "1" });
    ensureShopLive();
    if (state.settleStatus === "approved") {
      bootstrapShopSync({ force: new URLSearchParams(location.search).get("reset") === "1" });
    }
    save();
    bootstrapOrderSync();
    render();
  </script>
</body>
</html>
